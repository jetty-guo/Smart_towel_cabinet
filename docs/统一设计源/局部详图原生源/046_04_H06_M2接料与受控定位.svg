<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img"><title>H06 M2接料与受控定位</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1120" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">46  H06 M2接料与受控定位</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">本部件位置、作用、可调项和拆换边界｜机械功能示意，不按比例</text><rect x="105" y="560" width="290" height="62" rx="30" fill="#d8e5ec" stroke="#18364d" stroke-width="2.5"/><circle cx="139" cy="591" r="25" fill="white" stroke="#18364d" stroke-width="3"/><circle cx="361" cy="591" r="25" fill="white" stroke="#18364d" stroke-width="3"/><path d="M185 538L315 538" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="475" y="560" width="550" height="62" rx="30" fill="#d8e5ec" stroke="#18364d" stroke-width="2.5"/><circle cx="509" cy="591" r="25" fill="white" stroke="#18364d" stroke-width="3"/><circle cx="991" cy="591" r="25" fill="white" stroke="#18364d" stroke-width="3"/><path d="M555 538L945 538" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="530" y="488" width="370" height="48" rx="10" fill="#fff3d7" stroke="#ad671c" stroke-width="2.5"/><path d="M545 498L885 498" fill="none" stroke="#d8b477" stroke-width="3"/><path d="M450 390H1030V650H450Z" fill="none" stroke="#426bc2" stroke-width="3" stroke-dasharray="9 7"/><text x="165" y="510" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">M1先停</text><text x="575" y="345" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="400">M2受控保持空间</text><path d="M475 780L1025 780" fill="none" stroke="#087f86" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><path d="M475 768L475 792" fill="none" stroke="#587080" stroke-width="3"/><path d="M1025 768L1025 792" fill="none" stroke="#587080" stroke-width="3"/><text x="680.0" y="762" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">L保持</text><path d="M560 680L900 680" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="595" y="730" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">先接住，再定位停车</text><text x="180" y="890" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">d停包含控制延迟、打滑与制动滑行</text><rect x="1130" y="235" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="235" width="600" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1152" y="282" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">① 怎样工作</text><text x="1152" y="331" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">M2独立接住本条；M1停车后仍可按验证条件</text><text x="1152" y="369" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">将其完整带入保持区。</text><rect x="1130" y="505" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="505" width="600" height="7" rx="3" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="1152" y="552" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">② 哪些要调 / 测</text><text x="1152" y="601" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">v1/v2配合、停车滑行d停及L保持须覆盖实际</text><text x="1152" y="639" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">展开姿态。</text><rect x="1130" y="775" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="775" width="600" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1152" y="822" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">③ 怎样维护</text><text x="1152" y="871" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">轴动不代表布动；换带或速度调整后重测交接</text><text x="1152" y="909" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">与停车证据。</text><path d="M65 1048L1735 1048" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1090" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>