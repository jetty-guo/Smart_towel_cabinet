<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img"><title>H03 M1送料平带与轴承</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1120" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">43  H03 M1送料平带与轴承</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">本部件位置、作用、可调项和拆换边界｜机械功能示意，不按比例</text><rect x="290" y="425" width="680" height="62" rx="30" fill="#d8e5ec" stroke="#18364d" stroke-width="2.5"/><circle cx="324" cy="456" r="25" fill="white" stroke="#18364d" stroke-width="3"/><circle cx="936" cy="456" r="25" fill="white" stroke="#18364d" stroke-width="3"/><path d="M370 403L890 403" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="360" width="300" height="45" rx="10" fill="#fff3d7" stroke="#ad671c" stroke-width="2.5"/><path d="M450 370L720 370" fill="none" stroke="#d8b477" stroke-width="3"/><rect x="140" y="410" width="90" height="95" rx="8" fill="#c9dbe5" stroke="#18364d" stroke-width="2.5"/><path d="M230 458L324 458" fill="none" stroke="#18364d" stroke-width="3"/><rect x="250" y="440" width="33" height="37" rx="3" fill="#b9dedc" stroke="#087f86" stroke-width="2.5"/><rect x="300" y="505" width="48" height="90" rx="5" fill="#c9dbe5" stroke="#18364d" stroke-width="2.5"/><path d="M324 486L324 553" fill="none" stroke="#18364d" stroke-width="3"/><rect x="911" y="505" width="48" height="90" rx="5" fill="#c9dbe5" stroke="#18364d" stroke-width="2.5"/><path d="M935 486L935 553" fill="none" stroke="#18364d" stroke-width="3"/><text x="130" y="360" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">减速电机</text><text x="355" y="600" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">独立轴承支撑</text><path d="M845 700L1005 700" fill="none" stroke="#087f86" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><path d="M845 688L845 712" fill="none" stroke="#587080" stroke-width="3"/><path d="M1005 688L1005 712" fill="none" stroke="#587080" stroke-width="3"/><text x="855.0" y="682" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">Δx张紧</text><path d="M935 560L1005 650" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="300" y="800" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">动力：电机 → 联接 → 主动轴 → 平送料带</text><rect x="1130" y="235" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="235" width="600" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1152" y="282" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">① 怎样工作</text><text x="1152" y="331" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">减速电机经联接驱动主动轴，轴承承受轴系及</text><text x="1152" y="369" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">皮带张紧载荷。</text><rect x="1130" y="505" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="505" width="600" height="7" rx="3" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="1152" y="552" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">② 哪些要调 / 测</text><text x="1152" y="601" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">轴平行、张紧行程Δx、带材与预紧需配套标</text><text x="1152" y="639" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">定。</text><rect x="1130" y="775" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="775" width="600" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1152" y="822" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">③ 怎样维护</text><text x="1152" y="871" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">隔离能源后换带；恢复护罩并做跑偏、打滑及</text><text x="1152" y="909" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">真值条数复验。</text><path d="M65 1048L1735 1048" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1090" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>