idth="2.5" marker-start="url(#a)" marker-end="url(#a)"/><path d="M978 335L1002 335" fill="none" stroke="#587080" stroke-width="3"/><path d="M978 675L1002 675" fill="none" stroke="#587080" stroke-width="3"/><text transform="translate(972 505.0) rotate(-90)" text-anchor="middle" fill="#087f86" font-family="PingFang SC,Arial,sans-serif" font-size="26">l窗</text><text x="210" y="275" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="400">底托俯视；四周支撑，中央开窗</text><path d="M170 830L440 830" fill="none" stroke="#18364d" stroke-width="3"/><path d="M660 830L960 830" fill="none" stroke="#18364d" stroke-width="3"/><rect x="410" y="850" width="290" height="62" rx="30" fill="#d8e5ec" stroke="#18364d" stroke-width="2.5"/><circle cx="444" cy="881" r="25" fill="white" stroke="#18364d" stroke-width="3"/><circle cx="666" cy="881" r="25" fill="white" stroke="#18364d" stroke-width="3"/><path d="M490 828L620 828" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="170" y="920" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">下方皮带示意</text><rect x="1130" y="235" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="235" width="600" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1152" y="282" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">① 怎样工作</text><text x="1152" y="331" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">底托承担部分堆重；开窗让送料带接触底层毛</text><text x="1152" y="369" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">巾。</text><rect x="1130" y="505" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="505" width="600" height="7" rx="3" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="11