<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img"><title>H07 身份保持与释放件</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1120" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">47  H07 身份保持与释放件</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">本部件位置、作用、可调项和拆换边界｜机械功能示意，不按比例</text><rect x="150" y="350" width="775" height="430" rx="12" fill="#e8f2f4" stroke="#087f86" stroke-width="2.5"/><rect x="195" y="650" width="580" height="62" rx="30" fill="#d8e5ec" stroke="#18364d" stroke-width="2.5"/><circle cx="229" cy="681" r="25" fill="white" stroke="#18364d" stroke-width="3"/><circle cx="741" cy="681" r="25" fill="white" stroke="#18364d" stroke-width="3"/><path d="M275 628L695 628" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="290" y="565" width="420" height="45" rx="10" fill="#fff3d7" stroke="#ad671c" stroke-width="2.5"/><path d="M305 575L695 575" fill="none" stroke="#d8b477" stroke-width="3"/><rect x="385" y="405" width="220" height="40" rx="12" fill="#bed1ed" stroke="#426bc2" stroke-width="2.5"/><text x="390" y="380" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">局部天线</text><rect x="825" y="475" width="22" height="220" rx="0" fill="#a8caca" stroke="#087f86" stroke-width="2.5"/><path d="M835 350L835 450" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><circle cx="940" cy="475" r="12" fill="white" stroke="#087f86" stroke-width="3"/><circle cx="940" cy="695" r="12" fill="white" stroke="#087f86" stroke-width="3"/><text x="965" y="481" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">开</text><text x="965" y="701" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">关</text><text x="195" y="840" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">释放件与反馈：开到位 / 关到位 / 超时</text><rect x="1130" y="235" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="235" width="600" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1152" y="282" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">① 怎样工作</text><text x="1152" y="331" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">毛巾保持在公众不可触及区域；身份和物理条</text><text x="1152" y="369" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">件通过后才释放。</text><rect x="1130" y="505" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="505" width="600" height="7" rx="3" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="1152" y="552" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">② 哪些要调 / 测</text><text x="1152" y="601" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">保持长度L保持覆盖实物及停车余量；挡板行</text><text x="1152" y="639" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">程和到位反馈成对设计。</text><rect x="1130" y="775" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="775" width="600" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1152" y="822" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">③ 怎样维护</text><text x="1152" y="871" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">夹巾、无身份或不到位时保持异常；由授权维</text><text x="1152" y="909" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">护路径取出。</text><path d="M65 1048L1735 1048" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1090" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>