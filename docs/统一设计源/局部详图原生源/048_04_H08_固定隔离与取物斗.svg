<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img"><title>H08 固定隔离与取物斗</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1120" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">48  H08 固定隔离与取物斗</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">本部件位置、作用、可调项和拆换边界｜机械功能示意，不按比例</text><rect x="125" y="330" width="390" height="320" rx="4" fill="#dbe6ed" stroke="#18364d" stroke-width="2.5"/><text x="180" y="390" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="400">内部受控区</text><path d="M510 530H650V720H1000V610" fill="none" stroke="#18364d" stroke-width="3"/><path d="M510 450H720V630H1000" fill="none" stroke="#18364d" stroke-width="3"/><rect x="770" y="670" width="180" height="33" rx="10" fill="#fff3d7" stroke="#ad671c" stroke-width="2.5"/><path d="M785 680L935 680" fill="none" stroke="#d8b477" stroke-width="3"/><circle cx="595" cy="540" r="12" fill="#e0eeee" stroke="#087f86" stroke-width="3"/><circle cx="935" cy="745" r="12" fill="#e0eeee" stroke="#087f86" stroke-width="3"/><text x="552" y="585" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">S2经过</text><text x="813" y="795" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">S3有物/清空</text><text x="770" y="580" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">公共取物口</text><text x="150" y="865" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">通道为候选折线路径；不能据此认定防伸手合格</text><rect x="1130" y="235" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="235" width="600" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1152" y="282" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">① 怎样工作</text><text x="1152" y="331" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">固定防护隔开库存及危险运动；取物斗只容纳</text><text x="1152" y="369" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">本次交付。</text><rect x="1130" y="505" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="505" width="600" height="7" rx="3" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="1152" y="552" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">② 哪些要调 / 测</text><text x="1152" y="601" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">入口和通道几何须完成可触及与拉拽验证；弯</text><text x="1152" y="639" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">折不等于防护合格。</text><rect x="1130" y="775" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="775" width="600" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1152" y="822" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">③ 怎样维护</text><text x="1152" y="871" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">取物斗可独立清洁；S2/S3须与本次释放过程</text><text x="1152" y="909" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">有序关联。</text><path d="M65 1048L1735 1048" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1090" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>