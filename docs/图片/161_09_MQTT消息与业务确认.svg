<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1390" viewBox="0 0 1800 1390" role="img"><title>MQTT消息送到 ≠ 毛巾业务完成</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1390" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">161  MQTT消息送到 ≠ 毛巾业务完成</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">MQTT要求已写入方案；Broker、适配服务和设备固件仍待开发联调</text><rect x="45" y="175" width="290" height="64" rx="12" fill="#dceef0" stroke="#087f86" stroke-width="2.5"/><text x="64" y="216" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="700">柜端主控</text><path d="M190 244L190 1190" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="515" y="175" width="290" height="64" rx="12" fill="#dceef0" stroke="#087f86" stroke-width="2.5"/><text x="534" y="216" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="700">MQTT Broker</text><path d="M660 244L660 1190" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="1005" y="175" width="290" height="64" rx="12" fill="#dceef0" stroke="#087f86" stroke-width="2.5"/><text x="1024" y="216" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="700">Liveo适配／业务服务</text><path d="M1150 244L1150 1190" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="1455" y="175" width="290" height="64" rx="12" fill="#dceef0" stroke="#087f86" stroke-width="2.5"/><text x="1474" y="216" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="700">Liveo App</text><path d="M1600 244L1600 1190" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><path d="M1150 330L190 330" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="205" y="308" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">① 经Broker传送命令／许可；柜端先验权与落盘</text><path d="M190 412h45v25h-45" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="255" y="404" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">② 按许可与本地安全执行，保存物理事件</text><path d="M190 524L660 524" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="205" y="502" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">③ 原eventId，QoS 1上报</text><path d="M660 621L190 621" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="205" y="599" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">④ PUBACK：仅MQTT确认</text><path d="M660 718L1150 718" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="675" y="696" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">⑤ 转交事件；平台耐久接收与校验</text><path d="M1150 815L190 815" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="205" y="793" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">⑥ 经Broker回RECEIVED：原件收到，未等于销账</text><path d="M1150 912L190 912" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="205" y="890" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">⑦ 经Broker回APPLIED／REVIEW_REQUIRED</text><path d="M1150 1009L1600 1009" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="1165" y="987" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">⑧ 平台通知实际业务结果</text><path d="M190 1106L1150 1106" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="205" y="1084" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">⑨ 丢确认：经Broker补传／查询原eventId</text><rect x="65" y="1190" width="1670" height="103" rx="12" fill="#fff4e5" stroke="#efd2a5" stroke-width="2.5"/><text x="95" y="1230" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">消息可能重复、晚到、断电丢连接；commandId/eventId去重与物理证据不能省。</text><text x="95" y="1270" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">重连／换网保留原任务；retain动作命令拒绝；超时只升级核验，不推定成功。</text><path d="M65 1318L1735 1318" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1360" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>