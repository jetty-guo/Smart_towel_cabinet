<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img"><title>断网与重试：为什么不能再发一条</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1180" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">28  断网与重试：为什么不能再发一条</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">一次物理执行与至少一次消息重传分开控制</text><rect x="60.0" y="175" width="240" height="100" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="60.0" y="175" width="240" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="82.0" y="224" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">Liveo App</text><path d="M180.0 280L180.0 1040" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="540.0" y="175" width="240" height="100" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="540.0" y="175" width="240" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="562.0" y="224" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">平台服务</text><path d="M660.0 280L660.0 1040" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="1020.0" y="175" width="240" height="100" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1020.0" y="175" width="240" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1042.0" y="224" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">柜端控制</text><path d="M1140.0 280L1140.0 1040" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="1500.0" y="175" width="240" height="100" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1500.0" y="175" width="240" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1522.0" y="224" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">事件记录</text><path d="M1620.0 280L1620.0 1040" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><path d="M660.0 340L1140.0 340" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="796.8" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">发送commandId=C1</text><path d="M1140.0 425L1620.0 425" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="1246.8" y="410" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">持久化接受C1并执行一次</text><path d="M1140.0 510L660.0 510" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="784.2" y="495" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">应答丢失 / 平台超时</text><path d="M180.0 595L660.0 595" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="300.0" y="580" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">查询进度或重复同请求</text><path d="M660.0 680L1140.0 680" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="765.6" y="665" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">查询C1；必要时重投同C1</text><path d="M1140.0 765L660.0 765" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="756.0" y="750" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">返回原任务状态，不再驱动</text><path d="M1140.0 850L1620.0 850" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="1294.8" y="835" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">保存结果事件E1</text><path d="M1140.0 935L660.0 935" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="765.6" y="920" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">补传E1；重复上报仍用E1</text><path d="M660.0 1020L180.0 1020" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="264.0" y="1005" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">事件幂等处理，显示实际结果</text><path d="M65 1108L1735 1108" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1150" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">功能与空间示意，非加工图；参数、比例和安全边界须由工程图与样机验证。</text></svg>