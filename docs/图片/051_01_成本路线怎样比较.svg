<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" role="img"><title>同一产品：四类成本一起算</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="950" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">51  同一产品：四类成本一起算</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同一款单柜的研发与验证，不表示多个外形或交付型号</text><rect x="90" y="200" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="90" y="200" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="112" y="249" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">一次性研发</text><text x="112" y="294" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">机械设计、台架、固件与Liveo集成</text><text x="112" y="330" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">不将样机研发费用当成单台材料价</text><path d="M840 300L945 300" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="965" y="200" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="965" y="200" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="987" y="249" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">单台硬件</text><text x="987" y="294" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同柜外壳、M1/M2、RFID、电控与回收</text><text x="987" y="330" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">供应商可以不同，接口和总装一致</text><rect x="90" y="460" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="90" y="460" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="112" y="509" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">运营维护</text><text x="112" y="554" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">折叠补货、收污、清洗与清卡</text><text x="112" y="590" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">计入单件异常位的物业响应工时</text><path d="M840 560L945 560" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="965" y="460" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="965" y="460" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="987" y="509" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">合格服务成本</text><text x="987" y="554" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同周期总成本÷合格服务次数</text><text x="987" y="590" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">零成功次数不能算便宜</text><text x="90" y="790" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">先验证统一产品，再用实测服务次数和真实报价评估成本；不是几款外壳报价对比。</text><path d="M65 878L1735 878" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="920" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">LVT-ONE / V1.6 · 参数或供应商调整必须通过统一版本变更，不得单独改变某张产品图。</text></svg>