<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img"><title>归还先到与旧事件晚到</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1180" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">151  归还先到与旧事件晚到</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">读图：从上到下是逻辑先后；箭头不是精确耗时，反馈不等于物理成功</text><rect x="30.0" y="180" width="220" height="72" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="54.0" y="226" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="700">回收柜</text><path d="M140.0 260L140.0 970" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="536.6666666666667" y="180" width="220" height="72" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="560.6666666666667" y="226" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="700">平台</text><path d="M646.6666666666667 260L646.6666666666667 970" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="1043.3333333333335" y="180" width="220" height="72" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="1067.3333333333335" y="226" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="700">借出证据</text><path d="M1153.3333333333335 260L1153.3333333333335 970" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="1550.0" y="180" width="220" height="72" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="1574.0" y="226" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="700">借用记录</text><path d="M1660.0 260L1660.0 970" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><path d="M140.0 325L646.6666666666667 325" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="160.0" y="309" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">接收returnSessionId＋候选EPC＋移交证据</text><path d="M646.6666666666667 413L1153.3333333333335 413" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="666.6666666666667" y="397" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">找同一资产对应的借出轮次</text><path d="M1153.3333333333335 501L646.6666666666667 501" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="666.6666666666667" y="485" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">借出完成事件暂缺：返回待补证</text><path d="M646.6666666666667 589L140.0 589" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="160.0" y="573" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">已收件待核验；资产禁止再发</text><path d="M1153.3333333333335 677L646.6666666666667 677" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="666.6666666666667" y="661" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">补齐原issueSessionId的取走证据</text><path d="M646.6666666666667 765L1660.0 765" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="666.6666666666667" y="749" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同一轮次确认借出并完成归还</text><path d="M140.0 853L646.6666666666667 853" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="160.0" y="837" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">重复或旧归还事件再次到达</text><path d="M646.6666666666667 941L1660.0 941" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="666.6666666666667" y="925" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">原结果去重；不得关闭新一轮借用</text><rect x="65" y="1010" width="1670" height="65" rx="12" fill="#fff5e8" stroke="#d8e4ec" stroke-width="2.5"/><text x="87" y="1051" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">投放人不等于原借用人；禁止按事件到达时“最新一笔借用”随意销账。</text><path d="M65 1108L1735 1108" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1150" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>