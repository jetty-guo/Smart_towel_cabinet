<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img"><title>从1688线索到批准物料</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1080" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">30  从1688线索到批准物料</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">商品页面是检索起点；实际毛巾试机、协议和交付边界决定能否选用</text><rect x="65" y="205" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="205" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="254" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">① 找候选</text><text x="87" y="299" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">按模块搜索与核验商家</text><text x="87" y="335" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">记录料号、链接和日期</text><path d="M590 312L625 312" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="205" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="635" y="205" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="657" y="254" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">② 统一询价</text><text x="657" y="299" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同范围BOM / NRE / 服务</text><text x="657" y="335" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">明确税费、数量和有效期</text><path d="M1160 312L1195 312" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1205" y="205" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1205" y="205" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1227" y="254" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">③ 证据硬门槛</text><text x="1227" y="299" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">真实样本连续试机</text><text x="1227" y="335" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">原始失败记录 / 本地协议</text><path d="M1468 420L1468 530" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1205" y="540" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1205" y="540" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1227" y="589" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">④ 样品联调</text><text x="1227" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">规格边界 + 异常用例</text><text x="1227" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">核对可维护和可替换性</text><path d="M1205 647L1170 647" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="540" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="635" y="540" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="657" y="589" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">⑤ 同口径比较</text><text x="657" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">总成本 / 维护 / 性能</text><text x="657" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">不能只比较整柜裸价</text><path d="M635 647L600 647" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="540" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="540" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="589" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">⑥ 冻结采购包</text><text x="87" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">批准样品与物料版本</text><text x="87" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">整机责任 / 替料规则</text><path d="M65 1008L1735 1008" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1050" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">功能与空间示意，非加工图；参数、比例和安全边界须由工程图与样机验证。</text></svg>