<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img"><title>标签耐洗与湿态读出是两项验证</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1080" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">25  标签耐洗与湿态读出是两项验证</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">左侧验证标签存活；右侧验证在真实湿巾和金属柜环境中的通信</text><rect x="80" y="210" width="745" height="190" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="80" y="210" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="102" y="259" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">A 工艺耐受</text><text x="102" y="304" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">洗涤 / 化学品 / 烘干 / 压力 / 弯折</text><text x="102" y="340" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">按厂家工艺及现场清洗条件核对</text><rect x="975" y="210" width="745" height="190" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="975" y="210" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="997" y="259" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">B 射频表现</text><text x="997" y="304" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">含水 / 标签朝向 / 叠压 / 周边标签</text><text x="997" y="340" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">在受控读区取得逐次实测</text><rect x="190" y="480" width="510" height="150" rx="8" fill="#fff5e7" stroke="#ad671c" stroke-width="2.5"/><rect x="570" y="500" width="70" height="95" rx="3" fill="#cce9e8" stroke="#087f86" stroke-width="2.5"/><text x="225" y="705" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">洗后仍完好 ≠ 湿态必能读到</text><rect x="1080" y="480" width="510" height="150" rx="8" fill="#d8e9f2" stroke="#426bc2" stroke-width="2.5"/><rect x="1430" y="510" width="60" height="85" rx="3" fill="#cce9e8" stroke="#087f86" stroke-width="2.5"/><path d="M1020 490Q950 550 1020 610" fill="none" stroke="#426bc2" stroke-width="3"/><path d="M990 465Q890 550 990 635" fill="none" stroke="#426bc2" stroke-width="3"/><text x="1050" y="705" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">位置和介质改变读取条件</text><rect x="260" y="830" width="1280" height="120" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="260" y="830" width="1280" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="282" y="879" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">选型结论：两项都通过，才进入该场景的批准组合</text><path d="M65 1008L1735 1008" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1050" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">功能与空间示意，非加工图；参数、比例和安全边界须由工程图与样机验证。</text></svg>