<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img"><title>出厂验收FAT：证明这台设备可发运</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1080" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">34  出厂验收FAT：证明这台设备可发运</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">批准设计验证先完成；每台检查不能替代设计寿命或长期可靠性验证</text><rect x="65" y="205" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="205" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="254" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">① 锁定版本</text><text x="87" y="299" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">序列号 / BOM / 图纸</text><text x="87" y="335" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">固件 / 配置 / 批次</text><path d="M590 312L625 312" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="205" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="635" y="205" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="657" y="254" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">② 静态与电气</text><text x="657" y="299" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">结构、防护、接线</text><text x="657" y="335" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">规定电气检查及I/O</text><path d="M1160 312L1195 312" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1205" y="205" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1205" y="205" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1227" y="254" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">③ 正常领还</text><text x="1227" y="299" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">满 / 半 / 近空仓</text><text x="1227" y="335" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">真实条数与身份对账</text><path d="M1468 420L1468 530" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1205" y="540" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1205" y="540" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1227" y="589" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">④ 异常挑战</text><text x="1227" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">重复指令 / 失联 / 重启</text><text x="1227" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">未取走 / 缺箱 / 读不到</text><path d="M1205 647L1170 647" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="540" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="635" y="540" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="657" y="589" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">⑤ 整改与复验</text><text x="657" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">保留失败及返修证据</text><text x="657" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">关键缺陷不放行</text><path d="M635 647L600 647" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="540" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="540" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="589" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">⑥ 出厂交付</text><text x="87" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">签署FAT / 资料 / 备件</text><text x="87" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">清洁包装与运输锁定</text><path d="M65 1008L1735 1008" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1050" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">功能与空间示意，非加工图；参数、比例和安全边界须由工程图与样机验证。</text></svg>