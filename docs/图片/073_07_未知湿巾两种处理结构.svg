<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1030" viewBox="0 0 1800 1030" role="img"><title>未知湿巾：单件隔离位与原仓保持</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1030" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">73  未知湿巾：单件隔离位与原仓保持</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同一台柜内的正常和异常状态，不是两款结构</text><rect x="110" y="215" width="490" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="110" y="215" width="490" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="132" y="264" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">R01 识别不明</text><text x="132" y="309" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">关联returnSessionId / caseId</text><text x="132" y="345" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">未确认前不结束原借用</text><path d="M605 315L725 315" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="730" y="215" width="950" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="730" y="215" width="950" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="752" y="264" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">R04单件位空闲且取得转移许可</text><text x="752" y="309" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">转入R04；确认实物到位、原仓清空</text><text x="752" y="345" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">本位锁定给一个caseId；禁止投入第二件</text><path d="M355 420V625H735" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><rect x="740" y="535" width="940" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="740" y="535" width="940" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="762" y="584" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">R04已占用或转移条件不满足</text><text x="762" y="629" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">物体留R01并停止接收；进入原会话待核验</text><text x="762" y="665" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">物业核验、封袋编号移交 → 复位 → 对账 → 恢复</text><text x="130" y="880" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="400">不把多个未知湿巾混成一箱；正常收件与待核验不能显示为同一个结果。</text><path d="M65 958L1735 958" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1000" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">LVT-ONE / V1.6 · 同一柜体与模块坐标；布局示意，毫米尺寸、公差、容量和安全距离待工程验证。</text></svg>