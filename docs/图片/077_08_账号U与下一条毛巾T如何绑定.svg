<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img"><title>账号U怎样与下一条毛巾T绑定</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1200" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">77  账号U怎样与下一条毛巾T绑定</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">按上下顺序阅读；发送、物理动作、收到事件、业务提交是不同阶段</text><rect x="65.0" y="175" width="250" height="65" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">账号U</text><path d="M190.0 250L190.0 1035" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="765.0" y="175" width="250" height="65" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="787.0" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">平台</text><path d="M890.0 250L890.0 1035" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="1465.0" y="175" width="250" height="65" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="1487.0" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">柜端</text><path d="M1590.0 250L1590.0 1035" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><path d="M190.0 340L890.0 340" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="212.0" y="293" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">认证请求；创建原任务S</text><path d="M890.0 450L1590.0 450" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="403" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">授权S；柜内形成下一条T</text><path d="M1590.0 560L890.0 560" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="513" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">T候选身份与受控保持证据</text><path d="M890.0 670L1590.0 670" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="623" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">核准S＋T；返回一次性ReleasePermit</text><path d="M1590.0 745h50v30h-50" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="1150.0" y="735" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">持久化许可；通过本地安全再释放</text><path d="M1590.0 890L890.0 890" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="843" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">原许可＋实际取走证据</text><path d="M890.0 1000L190.0 1000" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="212.0" y="953" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">最终提交U—S—T借用；未知则待核验</text><rect x="65" y="1047" width="1670" height="66" rx="12" fill="#fff4e5" stroke="#efd2a5" stroke-width="2.5"/><text x="90" y="1088" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">用户不指定EPC；柜端读到T不等于取走者自然人身份已证明。</text><path d="M65 1128L1735 1128" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1170" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">V1.4 规则示意｜须结合正文前置条件与异常分支；不是制造图、真实测试或上线证明。</text></svg>