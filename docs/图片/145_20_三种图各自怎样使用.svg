<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" role="img"><title>三类图共用同一产品</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="950" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">145  三类图共用同一产品</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同一款单柜的研发与验证，不表示多个外形或交付型号</text><rect x="90" y="200" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="90" y="200" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="112" y="249" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">场景与外观</text><text x="112" y="294" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同一外观母图置入泳池/健身房</text><text x="112" y="330" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">只有环境和人物变化，柜体不变</text><path d="M840 300L945 300" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="965" y="200" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="965" y="200" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="987" y="249" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">结构与局部详图</text><text x="987" y="294" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同一布局源与模块编号</text><text x="987" y="330" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">剖面方向、开口、维护接口相互对应</text><rect x="90" y="460" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="90" y="460" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="112" y="509" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">流程与时序图</text><text x="112" y="554" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">动作绑定到真实模块和检测位置</text><text x="112" y="590" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">许可、物体、回执和业务结果闭合</text><path d="M840 560L945 560" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="965" y="460" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="965" y="460" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="987" y="509" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">制造放行</text><text x="987" y="554" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">总装CAD、尺寸公差和试验记录</text><text x="987" y="590" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">三类图一致是前提，不等于实物通过</text><text x="90" y="790" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">不再用“外壳不同、只是概念图”解释冲突；一处修改，全套同步。</text><path d="M65 878L1735 878" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="920" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">LVT-ONE / V1.6 · 参数或供应商调整必须通过统一版本变更，不得单独改变某张产品图。</text></svg>