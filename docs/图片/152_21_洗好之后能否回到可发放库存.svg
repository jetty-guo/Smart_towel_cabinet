<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img"><title>洗好之后能否回到可发放库存</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1000" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">152  洗好之后能否回到可发放库存</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">读图：满足条件才进入正常路径；失败／未知走独立处理分支</text><rect x="600" y="170" width="600" height="140" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="600" y="170" width="600" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="622" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">输入</text><text x="622" y="266" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">QC合格＋标签身份核验＋待装柜清单</text><path d="M900 315L900 355" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M900 360L1200 490L900 620L600 490Z" fill="none" stroke="#087f86" stroke-width="3"/><text x="750" y="475" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="400">原借用已结、无冻结且清</text><text x="750" y="513" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="400">单与实物一致？</text><path d="M600 490H355V650" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="395" y="457" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="700">满足</text><path d="M1200 490H1465V650" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><text x="1320" y="457" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="700">不满足 / 未知</text><rect x="65" y="660" width="760" height="160" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="660" width="760" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="707" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">正常路径</text><text x="87" y="756" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">批准补货；逐条核对并进入可发放集合</text><rect x="975" y="660" width="760" height="160" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="975" y="660" width="760" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="997" y="707" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">保持 / 处理路径</text><text x="997" y="756" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">停在隔离或待入库；开启差异单，禁止发放</text><text x="65" y="891" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" font-weight="400">毛巾位置、卫生状态、借用状态是三个维度，不可用一个状态互相代替。</text><path d="M65 928L1735 928" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="970" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>