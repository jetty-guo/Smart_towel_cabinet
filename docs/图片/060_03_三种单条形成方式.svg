<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" role="img"><title>唯一产品：折叠、分离、保持、交付</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="950" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">60  唯一产品：折叠、分离、保持、交付</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同一款单柜的研发与验证，不表示多个外形或交付型号</text><rect x="90" y="200" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="90" y="200" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="112" y="249" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">H01/H02 统一上料</text><text x="112" y="294" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">折叠裸巾；按清洁批次与装载清单</text><text x="112" y="330" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">背部料仓在同柜净巾舱内</text><path d="M840 300L945 300" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="965" y="200" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="965" y="200" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="987" y="249" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">H03/H04 单条形成</text><text x="987" y="294" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">M1底带牵引；分离件抑制连带</text><text x="987" y="330" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">前后条的运动需在真实样本中验证</text><rect x="90" y="460" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="90" y="460" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="112" y="509" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">H05/H06 完整受控</text><text x="112" y="554" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">M2向柜前接料并停稳保持</text><text x="112" y="590" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">有效空间覆盖实物长度与停距</text><path d="M840 560L945 560" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="965" y="460" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="965" y="460" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="987" y="509" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">H07/H08 本条交付</text><text x="987" y="554" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">平台核本条并下发有效许可</text><text x="987" y="590" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">释放到左上口，取走后确认借用</text><text x="90" y="790" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">裸巾分离无法稳定通过时，退回同一产品设计；不能用另一外形图片替代验证。</text><path d="M65 878L1735 878" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="920" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">LVT-ONE / V1.6 · 参数或供应商调整必须通过统一版本变更，不得单独改变某张产品图。</text></svg>