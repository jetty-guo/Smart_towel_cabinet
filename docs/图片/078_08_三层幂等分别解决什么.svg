<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img"><title>三层幂等分别解决什么</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1000" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">78  三层幂等分别解决什么</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">读图：各列对应本节的不同对象或条件，结合底部说明对照阅读</text><rect x="65.0" y="200" width="536.6666666666666" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65.0" y="200" width="536.6666666666666" height="70" rx="8" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">请求幂等</text><circle cx="96.0" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="117.0" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">App重复点击</text><path d="M87.0 412L579.6666666666666 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="96.0" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="117.0" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">返回同一业务请求结果</text><rect x="631.6666666666666" y="200" width="536.6666666666666" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="631.6666666666666" y="200" width="536.6666666666666" height="70" rx="8" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="653.6666666666666" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">命令幂等</text><circle cx="662.6666666666666" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="683.6666666666666" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">网络重投与柜端重启</text><path d="M653.6666666666666 412L1146.3333333333333 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="662.6666666666666" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="683.6666666666666" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">持久化执行权，禁止重复动作</text><rect x="1198.3333333333333" y="200" width="536.6666666666666" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1198.3333333333333" y="200" width="536.6666666666666" height="70" rx="8" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1220.3333333333333" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">事件幂等</text><circle cx="1229.3333333333333" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="1250.3333333333333" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">补传、重复与乱序</text><path d="M1220.3333333333333 412L1713.0 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="1229.3333333333333" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="1250.3333333333333" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">对账后持久化，不重复记账</text><rect x="65" y="820" width="1670" height="80" rx="12" fill="#eef5f9" stroke="#d8e4ec" stroke-width="2.5"/><text x="90" y="857" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">Redis锁过期不是再次驱动的许可；未知结果进入待核验。<