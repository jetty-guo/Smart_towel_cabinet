<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1485" viewBox="0 0 1800 1485" role="img"><title>H07 身份保持与释放件</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1120" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">47  H07 身份保持与释放件</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">本部件位置、作用、可调项和拆换边界｜机械功能示意，不按比例</text><rect x="150" y="350" width="775" height="430" rx="12" fill="#e8f2f4" stroke="#087f86" stroke-width="2.5"/><rect x="195" y="650" width="580" height="62" rx="30" fill="#d8e5ec" stroke="#18364d" stroke-width="2.5"/><circle cx="229" cy="681" r="25" fill="white" stroke="#18364d" stroke-width="3"/><circle cx="741" cy="681" r="25" fill="white" stroke="#18364d" stroke-width="3"/><path d="M275 628L695 628" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="290" y="565" width="420" height="45" rx="10" fill="#fff3d7" stroke="#ad671c" stroke-width="2.5"/><path d="M305 575L695 575" fill="none" stroke="#d8b477" stroke-width="3"/><rect x="385" y="405" width="220" height="40" rx="12" fill="#bed1ed" stroke="#426bc2" stroke-width="2.5"/><text x="390" y="380" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">局部天线</text><rect x="825" y="475" width="22" height="220" rx="0" fill="#a8caca" stroke="#087f86" stroke-width="2.5"/><path d="M835 350L835 450" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><circle cx="940" cy="475" r="12" fill="white" stroke="#087f86" stroke-width="3"/><circle cx="940" cy="695" r="12" fill="white" stroke="#087f86" stroke-width="3"/><text x="965" y="481" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">开</text><text x="965" y="701" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">关</text><text x="195" y="840" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">释放件与反馈：开到位 / 关到位 / 超时</text><rect x="1130" y="235" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="235" width="600" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1152" y="282" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">① 怎样工作</text><text x="1152" y="331" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">毛巾保持在公众不可触及区域；身份和物理条</text><text x="1152" y="369" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">件通过后才释放。</text><rect x="1130" y="505" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="505" width="600" height="7" rx="3" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="1152" y="552" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">② 哪些要调 / 测</text><text x="1152" y="601" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">保持长度L保持覆盖实物及停车余量；挡板行</text><text x="1152" y="639" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">程和到位反馈成对设计。</text><rect x="1130" y="775" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="775" width="600" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1152" y="822" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">③ 怎样维护</text><text x="1152" y="871" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">夹巾、无身份或不到位时保持异常；由授权维</text><text x="1152" y="909" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">护路径取出。</text><path d="M65 1048L1735 1048" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1090" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text><rect x="55" y="1110" width="1690" height="350" rx="10" fill="#e9f2f4" stroke="#d8e4ec" stroke-width="2.5"/><rect x="100" y="1130" width="190.0" height="285.0" rx="2.85" fill="#eef1f2" stroke="#18364d" stroke-width="2.5"/><rect x="100" y="1403.6" width="190.0" height="11.4" rx="0" fill="#35444e" stroke="#18364d" stroke-width="2.5"/><rect x="128.5" y="1150.9" width="76.0" height="47.5" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="131.16" y="1176.65" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="8.5" font-weight="700">H01</text><rect x="128.5" y="1198.4" width="76.0" height="9.5" rx="4" fill="#679bbd" stroke="#18364d" stroke-width="2.5"/><text x="131.16" y="1205.15" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="8.5" font-weight="700">H06</text><rect x="134.2" y="1207.9" width="68.4" height="19.0" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="136.86" y="1219.4" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="8.5" font-weight="700">H08</text><rect x="223.5" y="1150.9" width="47.5" height="91.2" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="226.16" y="1198.5" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="8.5" font-weight="700">E01</text><rect x="214.0" y="1264.9" width="53.2" height="49.4" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="216.66" y="1291.6" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="8.5" font-weight="700">R01</text><rect x="208.3" y="1320.0" width="62.7" height="36.1" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="210.96" y="1340.05" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="8.5" font-weight="700">R02</text><rect x="191.2" y="1358.0" width="76.0" height="43.7" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="193.86" y="1381.85" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="8.5" font-weight="700">R03</text><rect x="130.4" y="1358.0" width="43.7" height="43.7" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="133.06" y="1381.85" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="8.5" font-weight="700">R04</text><path d="M242.5 1318.1V1358.0" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><path d="M219.7 1331.4L153.2 1352.3V1358.0" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><path d="M119.0 1356.1L271.0 1356.1" fill="none" stroke="#18364d" stroke-width="3" stroke-dasharray="10 8"/><text x="125.65" y="1282.0" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="5.7" font-weight="400">独立封闭污巾通道</text><text x="125.65" y="1292.45" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="5.32" font-weight="400">不得穿过净巾接触面</text><text x="375" y="1185" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">H07 在同一柜体中的位置</text><text x="375" y="1245" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">H01 净巾料仓</text><text x="705" y="1245" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">H06 M2接料保持</text><text x="1035" y="1245" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">H08 隔离取物斗</text><text x="1365" y="1245" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">E01 干燥电气舱</text><text x="375" y="1300" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">R01 湿巾识别仓</text><text x="705" y="1300" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">R02 转移分流</text><text x="1035" y="1300" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">R03 正常回收箱</text><text x="1365" y="1300" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">R04 单件异常箱</text><text x="375" y="1355" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">同柜定位；净巾从柜后向柜前输送。H01—H08位于左上净巾舱，位置见图02、17、19。</text></svg>