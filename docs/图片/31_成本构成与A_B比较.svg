<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img"><title>成本拆解：买得便宜不等于用得便宜</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1080" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">31  成本拆解：买得便宜不等于用得便宜</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同一周期、同一服务次数口径；未报价保持空白，不按零元汇总</text><rect x="80" y="200" width="1640" height="130" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="80" y="200" width="1640" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="102" y="249" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">每次成功服务成本 = 同周期相关总成本 ÷ 实际合格服务次数</text><rect x="80" y="450" width="520" height="235" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="80" y="450" width="520" height="7" rx="3" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="102" y="499" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">一次性开发</text><text x="102" y="544" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">机械 / 电控 / 协议</text><text x="102" y="580" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">工装 / 验证 / 定型</text><rect x="640" y="450" width="520" height="235" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="640" y="450" width="520" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="662" y="499" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">每台设备与交付</text><text x="662" y="544" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">BOM / 装配 / 质检</text><text x="662" y="580" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">物流 / 安装 / 调试</text><rect x="1200" y="450" width="520" height="235" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1200" y="450" width="520" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1222" y="499" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">持续运营</text><text x="1222" y="544" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">补货 / 清卡 / 清洗</text><text x="1222" y="580" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">包材 / 备件 / 损耗</text><rect x="80" y="810" width="800" height="150" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="80" y="810" width="800" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="102" y="859" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">裸巾路线重点</text><text x="102" y="904" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">分离磨耗、规范折叠与清卡人工</text><rect x="960" y="810" width="760" height="150" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="960" y="810" width="760" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="982" y="859" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">包装路线重点</text><text x="982" y="904" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">包材与装包人工对比机构节省</text><path d="M65 1008L1735 1008" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1050" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">功能与空间示意，非加工图；参数、比例和安全边界须由工程图与样机验证。</text></svg>