<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210" role="img"><title>待核验：立即处理，到期未结才升级</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1210" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">155  待核验：立即处理，到期未结才升级</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">指派不等于接单；超时不是自动销账条件</text><rect x="65" y="190" width="490" height="190" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="190" width="490" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="237" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">建单与保管</text><text x="87" y="286" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">caseId、指派人、期限、实际位置</text><text x="87" y="324" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">与保管人</text><rect x="655" y="190" width="490" height="190" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="655" y="190" width="490" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="677" y="237" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">确认接单</text><text x="677" y="286" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">实际接单人及时间；开始核实证据</text><rect x="1245" y="190" width="490" height="190" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1245" y="190" width="490" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1267" y="237" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">判断与审批</text><text x="1267" y="286" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">原任务结论、实物去向、额度、审计</text><path d="M560 285L640 285" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M1150 285L1230 285" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="385" y="510" width="650" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="385" y="510" width="650" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="407" y="557" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">到期仍无人／未解决</text><text x="407" y="606" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">升级主管、安排接管；保留原超期，不伪造成功</text><path d="M310 385V485H550V503" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><path d="M900 385V505" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><rect x="1125" y="800" width="610" height="220" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1125" y="800" width="610" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1147" y="847" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">两项分别验收</text><text x="1147" y="896" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">业务关单；本地清场与安全恢复。缺一不自动</text><text x="1147" y="934" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">放行</text><path d="M1490 385V790" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M1040 610H1180V285H1238" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="70" y="930" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">证据不足 → 争议处置；政策免责仍保留有接收人的资产差异子单。</text><text x="70" y="1000" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">无需等期限到达才处理。转派未签收前，原保管责任继续。</text><path d="M65 1138L1735 1138" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1180" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">V1.4 规则示意｜须结合正文前置条件与异常分支；不是制造图、真实测试或上线证明。</text></svg>