<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" role="img"><title>不通过就退回：同一设计的修订闭环</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="950" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">63  不通过就退回：同一设计的修订闭环</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">同一款单柜的研发与验证，不表示多个外形或交付型号</text><rect x="90" y="200" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="90" y="200" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="112" y="249" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">发现失败</text><text x="112" y="294" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">分离不稳、尺寸装不下或防护不合格</text><text x="112" y="330" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">保存原始试验和失败工况</text><path d="M840 300L945 300" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="965" y="200" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="965" y="200" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="987" y="249" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">定位与修改</text><text x="987" y="294" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">由机械/整机负责人修改统一布局</text><text x="987" y="330" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">记录原因、影响、版本和复验范围</text><rect x="90" y="460" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="90" y="460" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="112" y="509" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">全部同步</text><text x="112" y="554" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">总装、外观、剖面、场景、BOM与I/O</text><text x="112" y="590" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">旧图移出当前发布目录</text><path d="M840 560L945 560" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="965" y="460" width="745" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="965" y="460" width="745" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="987" y="509" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">复验后发布</text><text x="987" y="554" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">原失败工况和关联边界都通过</text><text x="987" y="590" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">受控批准后整包发布</text><text x="90" y="790" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">不另行展示第二款柜体，不把效果图统一当成制造和试验已经通过。</text><path d="M65 878L1735 878" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="920" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">LVT-ONE / V1.6 · 参数或供应商调整必须通过统一版本变更，不得单独改变某张产品图。</text></svg>