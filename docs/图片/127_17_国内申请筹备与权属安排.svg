<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img"><title>国内申请筹备与权属安排</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="700" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">127  国内申请筹备与权属安排</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">读图：按箭头顺序完成；未满足本节条件，不跳过检查进入下一步</text><rect x="65.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">01  确认成果与贡献</text><text x="87.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">实际技术方案、发明人及合</text><text x="87.0" y="334" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">同</text><path d="M458.0 305L486.0 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="492.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="492.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="514.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">02  核对权属与披露</text><text x="514.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">委托共同开发及对外公开安</text><text x="514.0" y="334" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">排</text><path d="M885.0 305L913.0 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="919.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="919.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="941.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">03  代理师评估</text><text x="941.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">类型、技术成熟度与材料完</text><text x="941.0" y="334" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">整性</text><path d="M1312.0 305L1340.0 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1346.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1346.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1368.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">04  准备申请文件</text><text x="1368.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">面向CNIPA办理，提交前正</text><text x="1368.0" y="334" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">式审阅</text><rect x="65" y="540" width="1670" height="75" rx="12" fill="#fff4e5" stroke="#efd2a5" stroke-width="2.5"/><text x="90" y="576" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">这是一张筹备关系图，不是完整法定办理程序，也不承诺授权。</text><path d="M65 628L1735 628" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="670" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>