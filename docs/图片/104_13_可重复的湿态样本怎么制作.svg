<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img"><title>可重复的湿态样本怎么制作</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="700" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">104  可重复的湿态样本怎么制作</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">读图：按箭头顺序完成；未满足本节条件，不跳过检查进入下一步</text><rect x="65.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">01  取得干基准m0</text><text x="87.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">同条毛巾按规定干燥</text><path d="M458.0 305L486.0 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="492.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="492.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="514.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">02  建立湿样m</text><text x="514.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">固定水质、浸湿和滴干时间</text><path d="M885.0 305L913.0 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="919.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="919.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="941.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">03  记录工程加水比</text><text x="941.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">(m−m0)÷m0×100%</text><path d="M1312.0 305L1340.0 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1346.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1346.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1368.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">04  固定读测姿态</text><text x="1368.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">折叠、标签方向和称量误差</text><rect x="65" y="540" width="1670" height="75" rx="12" fill="#fff4e5" stroke="#efd2a5" stroke-width="2.5"/><text x="90" y="576" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">该数值是干基加水比，不能当作RFID自动测湿结果。</text><path d="M65 628L1735 628" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="670" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>