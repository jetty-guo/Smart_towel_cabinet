text x="653.6666666666666" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">异常与归还 S05—S09</text><circle cx="662.6666666666666" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="683.6666666666666" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">未取、断网断电和湿巾</text><path d="M653.6666666666666 412L1146.3333333333333 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="662.6666666666666" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="683.6666666666666" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">未知、满箱、缺箱</text><rect x="1198.3333333333333" y="200" width="536.6666666666666" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1198.3333333333333" y="200" width="536.6666666666666" height="70" rx="8" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1220.3333333333333" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">运营闭环 S10—S12</text><circle cx="1229.3333333333333" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="1250.3333333333333" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">补货清卡、App真实进度</text><path d="M1220.3333333333333 412L1713.0 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="1229.3333333333333" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="1250.3333333333333" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">全流程实物、任务和事件终盘</text><rect x="65" y="820" width="1670" height="80" rx="12" fill="#eef5f9" stroke="#d8e4ec" stroke-width="2.5"/><text x="90" y="857" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">