<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#097d80"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="55" y="65" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="34" fill="#152d46" font-weight="700">从 0 到 1：每一阶段用证据放行</text><text x="55" y="108" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="20" fill="#526477" font-weight="400">文档筹备 → 实物验证 → 工厂交付 → 现场运营；未通过的阶段不自动进入下一阶段</text><rect x="65" y="180" width="460" height="195" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="65" y="180" width="460" height="8" rx="4" fill="#097d80"/><text x="85" y="223" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">G0 输入冻结</text><text x="85" y="262" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">毛巾 / 场地 / 业务规则</text><text x="85" y="293" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">交付：测量与签核规格</text><rect x="570" y="180" width="460" height="195" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="570" y="180" width="460" height="8" rx="4" fill="#097d80"/><text x="590" y="223" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">G1 分离台架</text><text x="590" y="262" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">裸巾与包体路线比较</text><text x="590" y="293" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">交付：完整逐次试验</text><rect x="1075" y="180" width="460" height="195" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="1075" y="180" width="460" height="8" rx="4" fill="#097d80"/><text x="1095" y="223" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">G2 工程样机</text><text x="1095" y="262" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">保持识别 / 安全 / Liveo</text><text x="1095" y="293" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">交付：冻结设计与验证</text><rect x="1075" y="490" width="460" height="195" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="1075" y="490" width="460" height="8" rx="4" fill="#097d80"/><text x="1095" y="533" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">G3 生产与FAT</text><text x="1095" y="572" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">首件 / 装配 / 每台验收</text><text x="1095" y="603" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">交付：版本及出厂报告</text><rect x="570" y="490" width="460" height="195" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="570" y="490" width="460" height="8" rx="4" fill="#097d80"/><text x="590" y="533" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">G4 安装与SAT</text><text x="590" y="572" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">场地 / 标定 / 培训</text><text x="590" y="603" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">交付：现场验收与交接</text><rect x="65" y="490" width="460" height="195" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="65" y="490" width="460" height="8" rx="4" fill="#097d80"/><text x="85" y="533" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">G5 试点复盘</text><text x="85" y="572" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">性能 / 人工 / 总成本</text><text x="85" y="603" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">交付：扩点或整改决定</text><path d="M525 280 L565 280" stroke="#097d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1030 280 L1070 280" stroke="#097d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1305 375 L1305 480" stroke="#097d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1075 590 L1035 590" stroke="#097d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M570 590 L530 590" stroke="#097d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="55" y="865" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="18" fill="#526477" font-weight="400">所有门槛为计划；无样机、签署报告或现场记录时，不得标记为已通过。</text></svg>