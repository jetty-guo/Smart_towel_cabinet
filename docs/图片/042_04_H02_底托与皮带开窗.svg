<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1485" viewBox="0 0 1800 1485" role="img"><title>H02 底托与皮带开窗</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1120" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">42  H02 底托与皮带开窗</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">本部件位置、作用、可调项和拆换边界｜机械功能示意，不按比例</text><rect x="180" y="300" width="750" height="420" rx="4" fill="#d6e1e8" stroke="#18364d" stroke-width="2.5"/><rect x="405" y="335" width="260" height="340" rx="3" fill="#e5f4f0" stroke="#087f86" stroke-width="2.5"/><path d="M430 350L430 650" fill="none" stroke="#087f86" stroke-width="3"/><path d="M485 350L485 650" fill="none" stroke="#087f86" stroke-width="3"/><path d="M540 350L540 650" fill="none" stroke="#087f86" stroke-width="3"/><path d="M595 350L595 650" fill="none" stroke="#087f86" stroke-width="3"/><path d="M640 350L640 650" fill="none" stroke="#087f86" stroke-width="3"/><text x="430" y="510" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="700">带面接触区</text><path d="M405 770L665 770" fill="none" stroke="#087f86" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><path d="M405 758L405 782" fill="none" stroke="#587080" stroke-width="3"/><path d="M665 758L665 782" fill="none" stroke="#587080" stroke-width="3"/><text x="465.0" y="752" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">w窗</text><path d="M990 335L990 675" fill="none" stroke="#087f86" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><path d="M978 335L1002 335" fill="none" stroke="#587080" stroke-width="3"/><path d="M978 675L1002 675" fill="none" stroke="#587080" stroke-width="3"/><text transform="translate(972 505.0) rotate(-90)" text-anchor="middle" fill="#087f86" font-family="PingFang SC,Arial,sans-serif" font-size="26">l窗</text><text x="210" y="275" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="400">底托俯视；四周支撑，中央开窗</text><path d="M170 830L440 830" fill="none" stroke="#18364d" stroke-width="3"/><path d="M660 830L960 830" fill="none" stroke="#18364d" stroke-width="3"/><rect x="410" y="850" width="290" height="62" rx="30" fill="#d8e5ec" stroke="#18364d" stroke-width="2.5"/><circle cx="444" cy="881" r="25" fill="white" stroke="#18364d" stroke-width="3"/><circle cx="666" cy="881" r="25" fill="white" stroke="#18364d" stroke-width="3"/><path d="M490 828L620 828" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="170" y="920" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">下方皮带示意</text><rect x="1130" y="235" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="235" width="600" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1152" y="282" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">① 怎样工作</text><text x="1152" y="331" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">底托承担部分堆重；开窗让送料带接触底层毛</text><text x="1152" y="369" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">巾。</text><rect x="1130" y="505" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="505" width="600" height="7" rx="3" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="1152" y="552" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">② 哪些要调 / 测</text><text x="1152" y="601" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">开窗宽w窗、长度l窗及支撑比例可调比较；不</text><text x="1152" y="639" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">以加压代替验证。</text><rect x="1130" y="775" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="775" width="600" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1152" y="822" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">③ 怎样维护</text><text x="1152" y="871" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">检查开窗圆角、毛刺与底托表面；禁止割伤毛</text><text x="1152" y="909" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">巾或标签。</text><path d="M65 1048L1735 1048" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1090" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text><rect x="55" y="1110" width="1690" height="350" rx="10" fill="#e9f2f4" stroke="#d8e4ec" stroke-width="2.5"/><rect x="100" y="1130" width="190.0" height="285.0" rx="2.85" fill="#eef1f2" stroke="#18364d" stroke-width="2.5"/><rect x="100" y="1403.6" width="190.0" height="11.4" rx="0" fill="#35444e" stroke="#18364d" stroke-width="2.5"/><rect x="128.5" y="1150.9" width="76.0" height="47.5" rx="4" fill="#b7dad8" stroke="#18364d" stroke-width="2.5"/><text x="131.16" y="1174.65" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="6.46" font-weight="700">H01</text><rect x="128.5" y="1198.4" width="76.0" height="9.5" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/>