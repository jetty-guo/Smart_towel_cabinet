<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" role="img"><title>湿巾剖面：同柜右口入，下部独立收集</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1150" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">26  湿巾剖面：同柜右口入，下部独立收集</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">R01入口小仓 → R02分流 → R03正常箱 / R04单件异常箱</text><rect x="90" y="200" width="440.0" height="660.0" rx="6.6" fill="#eef1f2" stroke="#18364d" stroke-width="2.5"/><rect x="90" y="833.6" width="440.0" height="26.4" rx="0" fill="#35444e" stroke="#18364d" stroke-width="2.5"/><rect x="156.0" y="248.4" width="176.0" height="110.0" rx="4" fill="#b7dad8" stroke="#18364d" stroke-width="2.5"/><text x="162.16" y="303.4" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14.96" font-weight="700">H01</text><rect x="156.0" y="358.4" width="176.0" height="22.0" rx="4" fill="#679bbd" stroke="#18364d" stroke-width="2.5"/><text x="162.16" y="369.4" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14.96" font-weight="700">H06</text><rect x="169.2" y="380.4" width="158.4" height="44.0" rx="4" fill="#a2d2d1" stroke="#18364d" stroke-width="2.5"/><text x="175.36" y="402.4" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14.96" font-weight="700">H08</text><rect x="376.0" y="248.4" width="110.0" height="211.2" rx="4" fill="#b5c7ed" stroke="#18364d" stroke-width="2.5"/><text x="382.16" y="354.0" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14.96" font-weight="700">E01</text><rect x="354.0" y="512.4" width="123.2" height="114.4" rx="4" fill="#f2ca94" stroke="#18364d" stroke-width="2.5"/><text x="360.16" y="569.6" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14.96" font-weight="700">R01</text><rect x="340.8" y="640.0" width="145.2" height="83.6" rx="4" fill="#eab37d" stroke="#18364d" stroke-width="2.5"/><text x="346.96" y="681.8" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14.96" font-weight="700">R02</text><rect x="301.2" y="728.0" width="176.0" height="101.2" rx="4" fill="#cfaa80" stroke="#18364d" stroke-width="2.5"/><text x="307.36" y="778.6" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14.96" font-weight="700">R03</text><rect x="160.4" y="728.0" width="101.2" height="101.2" rx="4" fill="#deb39f" stroke="#18364d" stroke-width="2.5"/><text x="166.56" y="778.6" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="14.96" font-weight="700">R04</text><path d="M420.0 635.6V728.0" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><path d="M367.2 666.4L213.2 714.8V728.0" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><path d="M134.0 723.6L486.0 723.6" fill="none" stroke="#18364d" stroke-width="3" stroke-dasharray="10 8"/><text x="149.4" y="552.0" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.2" font-weight="400">独立封闭污巾通道</text><text x="149.4" y="576.2" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="12.32" font-weight="400">不得穿过净巾接触面</text><rect x="760" y="180" width="650" height="160" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="760" y="180" width="650" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="782" y="229" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">R01 单条识别小仓</text><text x="782" y="274" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">外侧入口关妥后，才许可内部转移</text><path d="M1085 345L1085 400" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="760" y="410" width="650" height="140" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="760" y="410" width="650" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="782" y="459" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">R02 内部受控分流</text><text x="782" y="504" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">箱在位、批次与余量、路线许可一致</text><path d="M930 555V635H790V700" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M1240 555V635H1450V700" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><rect x="640" y="710" width="530" height="175" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="640" y="710" width="530" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="662" y="759" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">R03 正常回收抽箱</text><text x="662" y="804" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">核实身份与原借用轮次</text><text x="662" y="840" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">实物转移成功后才提交归还</text><rect x="1220" y="710" width="530" height="175" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1220" y="710" width="530" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1242" y="759" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">R04 单件异常抽箱</text><text x="1242" y="804" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">一次仅容纳一件未知物</text><text x="1242" y="840" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">绑定caseId，取出前不再装入</text><text x="700" y="975" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="700">R04已满／分流故障：保持R01并停收；禁止混入正常箱。</text><text x="90" y="1030" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">底门用于维护取箱。图中分流与通道均在同一柜体内，不能被画成外置回收副柜。</text><path d="M65 1078L1735 1078" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">LVT-ONE / V1.6 · 同一柜体与模块坐标；布局示意，毫米尺寸、公差、容量和安全距离待工程验证。</text></svg>