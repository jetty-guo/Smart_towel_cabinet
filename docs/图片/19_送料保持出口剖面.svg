<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img"><title>净巾纵剖：后方分离，向前识别交付</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1080" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">19  净巾纵剖：后方分离，向前识别交付</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">这是同一柜体左上净巾舱的放大；公众在图右，库存位于图左</text><rect x="130" y="265" width="370" height="260" rx="8" fill="#e3f0ec" stroke="#18364d" stroke-width="2.5"/><rect x="130" y="540" width="540" height="48" rx="8" fill="#6ca8a6" stroke="#18364d" stroke-width="2.5"/><rect x="710" y="540" width="590" height="48" rx="8" fill="#6a9fbf" stroke="#18364d" stroke-width="2.5"/><rect x="160" y="320" width="300" height="37" rx="7" fill="#fff7e8" stroke="#ad671c" stroke-width="2.5"/><rect x="160" y="375" width="300" height="37" rx="7" fill="#fff7e8" stroke="#ad671c" stroke-width="2.5"/><rect x="160" y="430" width="300" height="37" rx="7" fill="#fff7e8" stroke="#ad671c" stroke-width="2.5"/><rect x="500" y="440" width="44" height="90" rx="2" fill="#e6bd83" stroke="#ad671c" stroke-width="2.5"/><rect x="670" y="533" width="40" height="10" rx="1" fill="#a4bfc8" stroke="#18364d" stroke-width="2.5"/><rect x="1295" y="420" width="18" height="135" rx="1" fill="#2a8788" stroke="#087f86" stroke-width="2.5"/><rect x="860" y="340" width="220" height="35" rx="4" fill="#bfd1ed" stroke="#426bc2" stroke-width="2.5"/><rect x="815" y="480" width="330" height="38" rx="7" fill="#fff7e8" stroke="#ad671c" stroke-width="2.5"/><path d="M1313 552L1370 660H1580V700H1330V585" fill="none" stroke="#18364d" stroke-width="3"/><rect x="1430" y="620" width="140" height="36" rx="4" fill="#fff7e8" stroke="#ad671c" stroke-width="2.5"/><text x="175" y="240" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">H01库存 + H02底托</text><text x="160" y="640" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="400">H03 / M1 送料带</text><text x="720" y="640" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="400">H06 / M2保持</text><text x="475" y="375" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">H04分离</text><text x="650" y="705" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">H05过渡</text><text x="1190" y="370" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">H07释放件</text><text x="1400" y="755" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">H08取物斗</text><path d="M210 610L540 610" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M850 610L1160 610" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M720 850L1290 850" fill="none" stroke="#087f86" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><path d="M720 838L720 862" fill="none" stroke="#587080" stroke-width="3"/><path d="M1290 838L1290 862" fill="none" stroke="#587080" stroke-width="3"/><text x="935.0" y="832" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">有效保持长度 ≥ 实物长度 + 停距 + 定位余量</text><text x="90" y="930" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">先完整接住、停稳、读本条、取得ReleasePermit，再放至H08；无许可不公开交付。</text><text x="880" y="310" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">局部RFID天线</text><path d="M1300 380L1304 414" fill="none" stroke="#087f86" stroke-width="3"/><path d="M65 1008L1735 1008" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1050" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">LVT-ONE / V1.6 · 同一柜体与模块坐标；布局示意，毫米尺寸、公差、容量和安全距离待工程验证。</text></svg>