<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img"><title>主控联网：Wi-Fi、网口与SIM怎样分工</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1120" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">160  主控联网：Wi-Fi、网口与SIM怎样分工</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">建议配置：基础版优先复用现场网络；4G按需选配；图为方案示意，非已验证接线图</text><rect x="65" y="180" width="520" height="205" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="180" width="520" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="229" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">NET-W · Wi-Fi</text><text x="87" y="274" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">主控内置Wi-Fi</text><text x="87" y="310" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">接设备专用网络</text><text x="87" y="346" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">不含SIM与月租</text><path d="M325 385L325 440" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="640" y="180" width="520" height="205" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="640" y="180" width="520" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="662" y="229" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">NET-E · 有线</text><text x="662" y="274" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">主控带以太网</text><text x="662" y="310" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">接现场网口</text><text x="662" y="346" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">布线费用单列</text><path d="M900 385L900 440" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1215" y="180" width="520" height="205" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1215" y="180" width="520" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1237" y="229" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">NET-C · 4G</text><text x="1237" y="274" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">带蜂窝模组主板插SIM</text><text x="1237" y="310" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">或主控接外置4G路由器</text><text x="1237" y="346" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">两种结构择一，不重复买</text><path d="M1475 385L1475 440" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="445" width="1670" height="118" rx="12" fill="#dceef0" stroke="#087f86" stroke-width="2.5"/><text x="100" y="490" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">同一个柜端MQTT客户端 → TLS双向认证 → Liveo指定Broker → 平台适配服务</text><text x="100" y="533" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">所有NET配置都必须支持：QoS 1、原任务幂等、耐久事件、应用确认；双链路切换不创建新任务</text><path d="M900 563L900 613" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="625" width="800" height="242" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="625" width="800" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="674" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">柜内控制：即时执行与保护</text><text x="87" y="719" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">传感器 → 主控状态机 → 电机驱动／释放件</text><text x="87" y="755" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">本条许可＋本地安全通过才动作</text><text x="87" y="791" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">安全停机不依赖网络；工业I/O与驱动另行核算</text><rect x="925" y="625" width="810" height="242" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="925" y="625" width="810" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="947" y="674" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">Liveo平台：身份与最终结果</text><text x="947" y="719" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">Liveo App认证 → 平台授权 → 柜端任务</text><text x="947" y="755" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">识别实际毛巾 → 平台核验 → 本条释放许可</text><text x="947" y="791" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">取走／归还证据 → APPLIED后更新用户记录</text><rect x="65" y="912" width="1670" height="95" rx="12" fill="#fff4e5" stroke="#efd2a5" stroke-width="2.5"/><text x="95" y="954" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">SIM只是卡；还需要蜂窝模组、天线、供电和可用运营商。WiFi Scan不是Wi-Fi联网。</text><text x="95" y="990" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">金属柜关门后实测网络；无可信许可不释放；失联不凭超时补发毛巾。</text><path d="M65 1048L1735 1048" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1090" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>