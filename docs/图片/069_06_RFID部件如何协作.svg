<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img"><title>RFID标签、天线与读写器各做什么</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1000" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">69  RFID标签、天线与读写器各做什么</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">把无线身份读取与人、湿度、落箱位置分开理解</text><rect x="90" y="320" width="380" height="180" rx="10" fill="#fff3d7" stroke="#ad671c" stroke-width="2.5"/><path d="M105 330L455 330" fill="none" stroke="#d8b477" stroke-width="3"/><rect x="375" y="350" width="45" height="80" rx="12" fill="#cce4e7" stroke="#087f86" stroke-width="2.5"/><text x="115" y="280" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="400">毛巾＋无源标签</text><text x="145" y="570" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="400">标签存编号</text><rect x="705" y="340" width="105" height="200" rx="12" fill="#bbd0e8" stroke="#426bc2" stroke-width="2.5"/><text x="655" y="280" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="400">柜内天线</text><path d="M590 345Q670 440 590 535" fill="none" stroke="#426bc2" stroke-width="3"/><path d="M552 325Q632 440 552 555" fill="none" stroke="#426bc2" stroke-width="3"/><path d="M514 305Q594 440 514 575" fill="none" stroke="#426bc2" stroke-width="3"/><path d="M825 440L1120 440" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="880" y="398" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="400">馈线</text><rect x="1135" y="335" width="540" height="220" rx="12" fill="white" stroke="#18364d" stroke-width="2.5"/><text x="1200" y="420" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="33" font-weight="400">读写器 → 控制器</text><text x="1200" y="490" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">返回候选EPC集合</text><rect x="90" y="725" width="1585" height="180" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="90" y="725" width="1585" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="112" y="772" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">它不直接证明</text><text x="112" y="821" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">谁取走、物体条数、含水率、实物是否已落箱，需要各自的业务和物理证据。</text><path d="M65 928L1735 928" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="970" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>