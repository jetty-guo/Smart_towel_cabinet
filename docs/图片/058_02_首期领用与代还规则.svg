<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1310" viewBox="0 0 1800 1310" role="img"><title>领用与代还各自的授权</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1310" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">58  领用与代还各自的授权</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">按上下顺序阅读；发送、物理动作、收到事件、业务提交是不同阶段</text><rect x="65.0" y="175" width="250" height="65" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">领用账号A</text><path d="M190.0 250L190.0 1145" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="531.6666666666667" y="175" width="250" height="65" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="553.6666666666667" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">平台</text><path d="M656.6666666666667 250L656.6666666666667 1145" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="998.3333333333335" y="175" width="250" height="65" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="1020.3333333333335" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">柜端</text><path d="M1123.3333333333335 250L1123.3333333333335 1145" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="1465.0" y="175" width="250" height="65" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="1487.0" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">代还账号B</text><path d="M1590.0 250L1590.0 1145" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><path d="M190.0 340L656.6666666666667 340" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="212.0" y="293" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">认证领用；原子预留额度</text><path d="M656.6666666666667 450L1123.3333333333335 450" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="678.6666666666667" y="403" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">任务；保持核验后下发本条许可</text><path d="M1123.3333333333335 560L656.6666666666667 560" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="678.6666666666667" y="513" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">取走证据；平台确认A的借用</text><path d="M1590.0 670L656.6666666666667 670" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="678.6666666666667" y="623" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">B认证创建独立归还回执，不占领用额度</text><path d="M656.6666666666667 780L1123.3333333333335 780" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="678.6666666666667" y="733" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">入口许可；识别后锁A的原轮次与路线</text><path d="M1123.3333333333335 890L656.6666666666667 890" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="678.6666666666667" y="843" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">真实移交证据；核验A的原轮次</text><path d="M656.6666666666667 1000L190.0 1000" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="212.0" y="953" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">归还确认后解除A的原借用</text><path d="M656.6666666666667 1110L1590.0 1110" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="678.6666666666667" y="1063" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">B仅查看本人投放回执，不得查看A隐私</text><rect x="65" y="1157" width="1670" height="66" rx="12" fill="#fff4e5" stroke="#efd2a5" stroke-width="2.5"/><text x="90" y="1198" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">代还不占领用额度；投放人不决定被销账的借用人。</text><path d="M65 1238L1735 1238" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1280" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">V1.4 规则示意｜须结合正文前置条件与异常分支；不是制造图、真实测试或上线证明。</text></svg>