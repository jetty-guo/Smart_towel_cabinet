" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1242" y="697" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">权属与变更</text><text x="1242" y="746" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">模具设计归属及替料规则</text><path d="M1220 742L1130 480" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="665" y="675" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" font-weight="400">询价正文尚未发送；附件按采购与</text><text x="665" y="713" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" font-weight="400">专利保密边界选择。</text><path d="M65 928L1735 928" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="970" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>