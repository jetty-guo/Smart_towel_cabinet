<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img"><title>收到事件之后仍有结果闭环</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="700" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">84  收到事件之后仍有结果闭环</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">读图：按箭头顺序完成；未满足本节条件，不跳过检查进入下一步</text><rect x="65.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">01  命令未知</text><text x="87.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">查原命令；不换ID重发</text><path d="M458.0 305L486.0 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="492.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="492.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="514.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">02  事件未收到</text><text x="514.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">同eventId退避补传</text><path d="M885.0 305L913.0 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="919.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="919.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="941.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">03  已收到未应用</text><text x="941.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">查QueryTaskResult保留</text><text x="941.0" y="334" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">原占用</text><path d="M1312.0 305L1340.0 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1346.0" y="200" width="389.0" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1346.0" y="200" width="389.0" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1368.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">04  超T_settle</text><text x="1368.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">建责任单升级；不猜成功</text><rect x="65" y="540" width="1670" height="75" rx="12" fill="#fff4e5" stroke="#efd2a5" stroke-width="2.5"/><text x="90" y="576" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">重启从持久化阶段恢复；待核验结案与本地安全恢复分别检查。</text><path d="M65 628L1735 628" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="670" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">V1.4 规则示意｜须结合正文前置条件与异常分支；不是制造图、真实测试或上线证明。</text></svg>