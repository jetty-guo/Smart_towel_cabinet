ti SC,Arial,sans-serif" font-size="30" font-weight="700">右中回收口</text><text x="1142" y="739" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">R01识别 → R02受控转移</text><rect x="1120" y="790" width="610" height="128" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1120" y="790" width="610" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1142" y="839" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">下部两只抽箱</text><text x="1142" y="884" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">R03正常；R04单件异常位</text><text x="95" y="1040" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">同一柜体内净污分舱；外部只有一个领巾口和一个归还口。</text><text x="95" y="1090" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">图中区域是安装空间；隔板、密封、检修通道与传动护罩必须在总装CAD中落实。</text><path d="M65 1188L1735 1188" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1230" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">LVT-ONE / V1.6 · 同一柜体与模块坐标；布局示意，毫米尺寸、公差、容量和安全距离待工程验证。</text></svg>