<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140" role="img"><title>故障位置与实物去向</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1140" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">06  故障位置与实物去向</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">统一模块位置；箭头或框线不构成已完成的性能、安全或专利证明</text><rect x="130" y="210" width="450.0" height="675.0" rx="6.75" fill="#eef1f2" stroke="#18364d" stroke-width="2.5"/><rect x="130" y="858.0" width="450.0" height="27.0" rx="0" fill="#35444e" stroke="#18364d" stroke-width="2.5"/><rect x="197.5" y="259.5" width="180.0" height="112.5" rx="4" fill="#b7dad8" stroke="#18364d" stroke-width="2.5"/><text x="203.8" y="315.75" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15.3" font-weight="700">H01</text><rect x="197.5" y="372.0" width="180.0" height="22.5" rx="4" fill="#679bbd" stroke="#18364d" stroke-width="2.5"/><text x="203.8" y="383.25" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15.3" font-weight="700">H06</text><rect x="211.0" y="394.5" width="162.0" height="45.0" rx="4" fill="#a2d2d1" stroke="#18364d" stroke-width="2.5"/><text x="217.3" y="417.0" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15.3" font-weight="700">H08</text><rect x="422.5" y="259.5" width="112.5" height="216.0" rx="4" fill="#b5c7ed" stroke="#18364d" stroke-width="2.5"/><text x="428.8" y="367.5" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15.3" font-weight="700">E01</text><rect x="400.0" y="529.5" width="126.0" height="117.0" rx="4" fill="#f2ca94" stroke="#18364d" stroke-width="2.5"/><text x="406.3" y="588.0" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15.3" font-weight="700">R01</text><rect x="386.5" y="660.0" width="148.5" height="85.5" rx="4" fill="#eab37d" stroke="#18364d" stroke-width="2.5"/><text x="392.8" y="702.75" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15.3" font-weight="700">R02</text><rect x="346.0" y="750.0" width="180.0" height="103.5" rx="4" fill="#cfaa80" stroke="#18364d" stroke-width="2.5"/><text x="352.3" y="801.75" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15.3" font-weight="700">R03</text><rect x="202.0" y="750.0" width="103.5" height="103.5" rx="4" fill="#deb39f" stroke="#18364d" stroke-width="2.5"/><text x="208.3" y="801.75" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15.3" font-weight="700">R04</text><path d="M467.5 655.5V750.0" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><path d="M413.5 687.0L256.0 736.5V750.0" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><path d="M175.0 745.5L535.0 745.5" fill="none" stroke="#18364d" stroke-width="3" stroke-dasharray="10 8"/><text x="190.75" y="570.0" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.5" font-weight="400">独立封闭污巾通道</text><text x="190.75" y="594.75" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="12.6" font-weight="400">不得穿过净巾接触面</text><rect x="810" y="210" width="880" height="128" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="810" y="210" width="880" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="832" y="259" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">H03/H04连带或卡巾</text><text x="832" y="304" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">停止M1/M2，保持任务，不盲重发</text><rect x="810" y="355" width="880" height="128" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="810" y="355" width="880" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="832" y="404" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">H07许可或门位异常</text><text x="832" y="449" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">保持本条，授权维护取出并对账</text><rect x="810" y="500" width="880" height="128" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="810" y="500" width="880" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="832" y="549" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">R01/R02转移不明</text><text x="832" y="594" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">停收、保留回执，核实原仓与目标箱</text><rect x="810" y="645" width="880" height="128" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="810" y="645" width="880" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="832" y="694" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">R03/R04箱体异常</text><text x="832" y="739" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">核箱在位、批次及容量后才恢复</text><text x="100" y="995" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">模块编号贯穿外观、剖面、安装、I/O与交底；任何位置调整须同步修改母图和关联文件。</text><path d="M65 1068L1735 1068" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1110" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">LVT-ONE / V1.6 · 同一柜体与模块坐标；布局示意，毫米尺寸、公差、容量和安全距离待工程验证。</text></svg>