<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img"><title>故障后如何停住并恢复</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1080" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">23  故障后如何停住并恢复</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">先安全停止，再确认实物与账务；“复位”不等于重新执行旧命令</text><rect x="65" y="205" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="205" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="254" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">① 检测到异常</text><text x="87" y="299" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">门位矛盾 / 卡巾 / 掉电</text><text x="87" y="335" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">或结果未知</text><path d="M590 312L625 312" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="205" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="635" y="205" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="657" y="254" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">② 本地保护</text><text x="657" y="299" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">停止相关危险动作</text><text x="657" y="335" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">禁止新任务</text><path d="M1160 312L1195 312" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1205" y="205" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1205" y="205" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1227" y="254" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">③ 保存现场状态</text><text x="1227" y="299" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">commandId / 物体位置</text><text x="1227" y="335" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">传感器 / 未确认事件</text><path d="M1468 420L1468 530" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1205" y="540" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1205" y="540" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1227" y="589" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">④ 授权排障</text><text x="1227" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">隔离能源 / 清理 / 换件</text><text x="1227" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">核验每条实物与任务</text><path d="M1205 647L1170 647" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="540" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="635" y="540" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="657" y="589" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">⑤ 复验与对账</text><text x="657" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">传感器 / 门位 / 通道清空</text><text x="657" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">平台处理异常记录</text><path d="M635 647L600 647" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="540" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="540" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="589" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">⑥ 恢复服务</text><text x="87" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">确认安全且没有未知任务</text><text x="87" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">通过后才接新授权</text><path d="M65 1008L1735 1008" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1050" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">功能与空间示意，非加工图；参数、比例和安全边界须由工程图与样机验证。</text></svg>