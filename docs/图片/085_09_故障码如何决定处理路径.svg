ang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">LOCAL_STORAGE_UNSAFE</text><path d="M1220.3333333333333 412L1713.0 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="1229.3333333333333" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="1250.3333333333333" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">DELIVERY_UNCERTAIN</text><path d="M1220.3333333333333 542L1713.0 542" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="1229.3333333333333" cy="576" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="1250.3333333333333" y="585" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">保护证据，禁止自动新发放</text><rect x="65" y="820" width="1670" height="80" rx="12" fill="#eef5f9" stroke="#d8e4ec" stroke-width="2.5"/><text x="90" y="857" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">正式数值业务码要按Liveo现行规范登记，图中只列语义。</text><path d="M65 928L1735 928" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="970" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>