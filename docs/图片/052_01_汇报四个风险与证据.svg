<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img"><title>关键风险与验证依据</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1000" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">52  关键风险与验证依据</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">读图：各列对应本节的不同对象或条件，结合底部说明对照阅读</text><rect x="65.0" y="200" width="395.0" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65.0" y="200" width="395.0" height="70" rx="8" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">条数</text><circle cx="96.0" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="117.0" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">一个EPC不等于一条</text><path d="M87.0 412L438.0 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="96.0" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="117.0" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">逐次实物计数</text><rect x="490.0" y="200" width="395.0" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="490.0" y="200" width="395.0" height="70" rx="8" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="512.0" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">停料</text><circle cx="521.0" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="542.0" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">M1停车后条可能跟随</text><path d="M512.0 412L863.0 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="521.0" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="542.0" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">测后条位移与滑行</text><rect x="915.0" y="200" width="395.0" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="915.0" y="200" width="395.0" height="70" rx="8" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="937.0" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">湿读</text><circle cx="946.0" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="967.0" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">耐洗不等于湿态可读</text><path d="M937.0 412L1288.0 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="946.0" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="967.0" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">湿态与姿态挑战</text><rect x="1340.0" y="200" width="395.0" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1340.0" y="200" width="395.0" height="70" rx="8" fill="#18364d" stroke="#18364d" stroke-width="2.5"/><text x="1362.0" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">交付</text><circle cx="1371.0" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="1392.0" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">应答不等于实际取走</text><path d="M1362.0 412L1713.0 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="1371.0" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="1392.0" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">有序证据与异常对账</text><rect x="65" y="820" width="1670" height="80" rx="12" fill="#eef5f9" stroke="#d8e4ec" stroke-width="2.5"/><text x="90" y="857" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">四类风险分别验证，不能用一个总体成功率覆盖。</text><path d="M65 928L1735 928" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="970" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>