l,sans-serif" font-size="30" font-weight="700">⑤ 物业演练</text><text x="657" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">补货 / 收污 / 清洁</text><text x="657" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">待核验 / 故障 / 恢复</text><path d="M635 647L600 647" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="540" width="525" height="215" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="540" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="589" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">⑥ 签核与试运营</text><text x="87" y="634" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">SAT记录与培训交接</text><text x="87" y="670" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">按指标评估扩点</text><path d="M65 1008L1735 1008" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1050" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">功能与空间示意，非加工图；参数、比例和安全边界须由工程图与样机验证。</text></svg>