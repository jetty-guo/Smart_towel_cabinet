<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1640" viewBox="0 0 1800 1640" role="img"><title>归还：先建回执，再锁轮次与路线</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1640" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">29  归还：先建回执，再锁轮次与路线</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">按上下顺序阅读；发送、物理动作、收到事件、业务提交是不同阶段</text><rect x="65.0" y="175" width="250" height="65" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">Liveo App</text><path d="M190.0 250L190.0 1475" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="765.0" y="175" width="250" height="65" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="787.0" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">平台</text><path d="M890.0 250L890.0 1475" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><rect x="1465.0" y="175" width="250" height="65" rx="12" fill="#e3eff4" stroke="#087f86" stroke-width="2.5"/><text x="1487.0" y="217" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">回收柜</text><path d="M1590.0 250L1590.0 1475" fill="none" stroke="#d8e4ec" stroke-width="3" stroke-dasharray="10 8"/><path d="M190.0 340L890.0 340" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="212.0" y="293" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">认证创建returnSessionId；不耗领用额度</text><path d="M890.0 450L1590.0 450" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="403" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">在线入口许可；柜端持久化接受</text><path d="M1590.0 560L190.0 560" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="212.0" y="513" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">等待投放；进入受控仓后才算已收件</text><path d="M1590.0 670L890.0 670" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="623" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">候选身份、回执、位置及识别证据</text><path d="M890.0 780L1590.0 780" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="733" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">锁原借用轮次；下发箱批次路线许可</text><path d="M1590.0 855h50v30h-50" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="1150.0" y="845" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">核许可、容量及安全；转移并确认</text><text x="1150.0" y="883" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">接收</text><path d="M1590.0 1000L890.0 1000" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="953" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">RETURN_TRANSFERRED＋实际位置证据</text><path d="M890.0 1110L1590.0 1110" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="1063" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">RECEIVED：原事件收到</text><path d="M1590.0 1220L890.0 1220" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="1173" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">QueryTaskResult：查原归还回执</text><path d="M890.0 1330L1590.0 1330" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="912.0" y="1283" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">APPLIED或待核验责任单；保存最终结果</text><path d="M890.0 1440L190.0 1440" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><text x="212.0" y="1393" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">APPLIED且原轮次归还成功，才解除在借</text><rect x="65" y="1487" width="1670" height="66" rx="12" fill="#fff4e5" stroke="#efd2a5" stroke-width="2.5"/><text x="90" y="1528" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" font-weight="400">转移前失联保持／隔离；已不可逆转移按实际箱存证并冻结。</text><path d="M65 1568L1735 1568" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1610" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">V1.4 规则示意｜须结合正文前置条件与异常分支；不是制造图、真实测试或上线证明。</text></svg>