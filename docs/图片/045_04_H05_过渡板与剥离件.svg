ill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">H05 在同一柜体中的位置</text><text x="375" y="1245" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">H01 净巾料仓</text><text x="705" y="1245" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">H06 M2接料保持</text><text x="1035" y="1245" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">H08 隔离取物斗</text><text x="1365" y="1245" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">E01 干燥电气舱</text><text x="375" y="1300" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">R01 湿巾识别仓</text><text x="705" y="1300" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">R02 转移分流</text><text x="1035" y="1300" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">R03 正常回收箱</text><text x="1365" y="1300" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="21" font-weight="400">R04 单件异常箱</text><text x="375" y="1355" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">同柜定位；净巾从柜后向柜前输送。H01—H08位于左上净巾舱，位置见图02、17、19。</text></svg>