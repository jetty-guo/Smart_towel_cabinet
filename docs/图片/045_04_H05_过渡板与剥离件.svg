<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1485" viewBox="0 0 1800 1485" role="img"><title>H05 过渡板与剥离件</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1120" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">45  H05 过渡板与剥离件</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">本部件位置、作用、可调项和拆换边界｜机械功能示意，不按比例</text><rect x="120" y="510" width="370" height="62" rx="30" fill="#d8e5ec" stroke="#18364d" stroke-width="2.5"/><circle cx="154" cy="541" r="25" fill="white" stroke="#18364d" stroke-width="3"/><circle cx="456" cy="541" r="25" fill="white" stroke="#18364d" stroke-width="3"/><path d="M200 488L410 488" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="610" y="510" width="390" height="62" rx="30" fill="#d8e5ec" stroke="#18364d" stroke-width="2.5"/><circle cx="644" cy="541" r="25" fill="white" stroke="#18364d" stroke-width="3"/><circle cx="966" cy="541" r="25" fill="white" stroke="#18364d" stroke-width="3"/><path d="M690 488L920 488" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><path d="M455 492H640V505H455Z" fill="none" stroke="#087f86" stroke-width="3"/><rect x="320" y="435" width="430" height="43" rx="10" fill="#fff3d7" stroke="#ad671c" stroke-width="2.5"/><path d="M335 445L735 445" fill="none" stroke="#d8b477" stroke-width="3"/><path d="M485 685L615 685" fill="none" stroke="#087f86" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><path d="M485 673L485 697" fill="none" stroke="#587080" stroke-width="3"/><path d="M615 673L615 697" fill="none" stroke="#587080" stroke-width="3"/><text x="480.0" y="667" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">g过渡</text><text x="125" y="410" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="400">M1 送料段</text><text x="770" y="410" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="400">M2 接料保持段</text><path d="M475 565L415 645" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><text x="125" y="730" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">剥离部位：避免随回程卷入</text><text x="530" y="820" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">前缘、包边和软塌姿态逐项试</text><rect x="1130" y="235" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="235" width="600" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1152" y="282" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">① 怎样工作</text><text x="1152" y="331" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">过渡板跨越M1/M2段间位置；剥离部位防止布</text><text x="1152" y="369" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">料随带回卷。</text><rect x="1130" y="505" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="505" width="600" height="7" rx="3" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="1152" y="552" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">② 哪些要调 / 测</text><text x="1152" y="601" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">过渡间隙g过渡及高度差Δh不能靠图估计；需</text><text x="1152" y="639" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">薄巾、厚包边测试。</text><rect x="1130" y="775" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="775" width="600" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1152" y="822" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">③ 怎样维护</text><text x="1152" y="871" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">拆下清绒毛并检查圆角；不得向运动间隙伸手</text><text x="1152" y="909" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">清卡。</text><path d="M65 1048L1735 1048" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1090" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text><rect x="55" y="1110" width="1690" height="350" rx="10" fill="#e9f2f4" stroke="#d8e4ec" stroke-width="2.5"/><rect x="100" y="1130" width="190.0" height="285.0" rx="2.85" fill="#eef1f2" stroke="#18364d" stroke-width="2.5"/><rect x="100" y="1403.6" width="190.0" height="11.4" rx="0" fill="#35444e" stroke="#18364d" stroke-width="2.5"/><rect x="128.5" y="1150.9" width="76.0" height="47.5" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="131.16" y="1176.65" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="8.5" font-weight="700">H01</text><rect x="128.5" y="1198.4" width="76.0" height="9.5" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="131.16" y="1205.15" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="8.5" font-weight="700">H06</text><rect x="134.2" y="1207.9" width="68.4" height="19.0" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="136.86" y="1219.4" fill="#1