<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#097d80"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="55" y="65" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="34" fill="#152d46" font-weight="700">交付接口：让分包组件能够装成一台可靠的柜子</text><text x="55" y="108" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="20" fill="#526477" font-weight="400">模块分别采购；接口、版本、验证与整机责任统一管理</text><rect x="65" y="185" width="460" height="180" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="65" y="185" width="460" height="8" rx="4" fill="#097d80"/><text x="85" y="228" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">机械接口</text><text x="85" y="267" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">基准 / 尺寸 / 公差</text><text x="85" y="298" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">姿态 / 间隙 / 检修</text><rect x="570" y="185" width="460" height="180" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="570" y="185" width="460" height="8" rx="4" fill="#097d80"/><text x="590" y="228" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">电气接口</text><text x="590" y="267" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">供电 / 峰值 / 电平</text><text x="590" y="298" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">针脚 / 接地 / 失电</text><rect x="1075" y="185" width="460" height="180" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="1075" y="185" width="460" height="8" rx="4" fill="#097d80"/><text x="1095" y="228" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">控制接口</text><text x="1095" y="267" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">许可 / 命令 / 反馈</text><text x="1095" y="298" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">超时 / 故障 / 复位</text><path d="M290 365 L795 465" stroke="#097d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M795 365 L795 465" stroke="#097d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1300 365 L795 465" stroke="#097d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="385" y="475" width="840" height="155" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="385" y="475" width="840" height="8" rx="4" fill="#097d80"/><text x="405" y="518" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">统一受控版本 + 双方联调证据</text><text x="405" y="557" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="19" fill="#152d46" font-weight="400">图纸 / BOM / 固件 / 配置 / 原始记录必须对应同一台设备</text><path d="M795 630 L795 690" stroke="#097d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="385" y="700" width="840" height="100" rx="14" fill="white" stroke="#d9e3eb" stroke-width="2"/><rect x="385" y="700" width="840" height="8" rx="4" fill="#097d80"/><text x="405" y="743" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#097d80" font-weight="700">整机负责人签核 → 生产 / FAT → 安装 / SAT</text><text x="55" y="865" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="18" fill="#526477" font-weight="400">缺口写入D决策项；改变任何关键接口或物料，先做影响评估和相应复验。</text></svg>