<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img"><title>闭环必须同时核对什么</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1000" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">147  闭环必须同时核对什么</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">读图：各列对应本节的不同对象或条件，结合底部说明对照阅读</text><rect x="65.0" y="200" width="536.6666666666666" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65.0" y="200" width="536.6666666666666" height="70" rx="8" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">实物与身份</text><circle cx="96.0" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="117.0" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">毛巾在哪里、EPC对应哪条资产</text><path d="M87.0 412L579.6666666666666 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="96.0" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="117.0" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">未知单件有独立位置和保管人</text><rect x="631.6666666666666" y="200" width="536.6666666666666" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="631.6666666666666" y="200" width="536.6666666666666" height="70" rx="8" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="653.6666666666666" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">任务与账务</text><circle cx="662.6666666666666" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="683.6666666666666" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">原任务、原许可和原借用轮次</text><path d="M653.6666666666666 412L1146.3333333333333 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="662.6666666666666" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="683.6666666666666" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">成功、未交付、待核验分别结论</text><rect x="1198.3333333333333" y="200" width="536.6666666666666" height="550" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1198.3333333333333" y="200" width="536.6666666666666" height="70" rx="8" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1220.3333333333333" y="247" fill="white" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">责任与恢复</text><circle cx="1229.3333333333333" cy="316" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="1250.3333333333333" y="325" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">指派与实际接单分开记录</text><path d="M1220.3333333333333 412L1713.0 412" fill="none" stroke="#d8e4ec" stroke-width="3"/><circle cx="1229.3333333333333" cy="446" r="5" fill="#087f86" stroke="#087f86" stroke-width="3"/><text x="1250.3333333333333" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">截止时间、异常子单和恢复条件</text><rect x="65" y="820" width="1670" height="80" rx="12" fill="#eef5f9" stroke="#d8e4ec" stroke-width="2.5"/><text x="90" y="857" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">文档、规则模型、实机及现场证据必须分开表达。</text><path d="M65 928L1735 928" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="970" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">V1.4 规则示意｜须结合正文前置条件与异常分支；不是制造图、真实测试或上线证明。</text></svg>