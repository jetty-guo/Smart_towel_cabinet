3"/><text x="130" y="360" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">减速电机</text><text x="355" y="600" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">独立轴承支撑</text><path d="M845 700L1005 700" fill="none" stroke="#087f86" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><path d="M845 688L845 712" fill="none" stroke="#587080" stroke-width="3"/><path d="M1005 688L1005 712" fill="none" stroke="#587080" stroke-width="3"/><text x="855.0" y="682" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">Δx张紧</text><path d="M935 560L1005 650" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="300" y="800" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">动力：电机 → 联接 → 主动轴 → 平送料带</text><rect x="1130" y="235" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="235" width="600" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1152" y="282" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">① 怎样工作</text><text x="1152" y="331" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">减速电机经联接驱动主动轴，轴承承受轴系及</text><text x="1152" y="369" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">皮带张紧载荷。</text><rect x="1130" y="505" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="505" width="600" height="7" rx="3" fill="#426bc2" stroke="#426bc2" stroke-width="2.5"/><text x="1152" y="552" fill="#426bc2" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">② 哪些要调 / 测</text><text x="1152" y="601" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">轴平行、张紧行程Δx、带材与预紧需配套标</text><text x="1152" y="639" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">定。</text><rect x="1130" y="775" width="600" height="225" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1130" y="775" width="600" height="7" rx="3" fill="#ad671c" stroke="#ad671c" stroke-width="2.5"/><text x="1152" y="822" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">③ 怎样维护</text><text x="1152" y="871" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">隔离能源后换带；恢复护罩并做跑偏、打滑及</text><text x="1152" y="909" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">真值条数复验。</text><path d="M65 1048L1735 1048" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1090" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text><rect x="55" y="1110" width="1690" height="350" rx="10" fill="#e9f2f4" stroke="#d8e4ec" stroke-width="2.5"/><rect x="100" y="1130" width="190.0" height="285.0" rx="2.85" fill="#eef1f2" stroke="#18364d" stroke-width="2.5"/><rect x="100" y="1403.6" width="190.0" height="11.4" rx="0" fill="#35444e" stroke="#18364d" stroke-width="2.5"/><rect x="128.5" y="1150.9" width="76.0" height="47.5" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="131.16" y="1174.65" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="6.46" font-weight="700">H01</text><rect x="128.5" y="1198.4" width="76.0" height="9.5" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="131.16" y="1203.15" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="6.46" font-weight="700">H06</text><rect x="134.2" y="1207.9" width="68.4" height="19.0" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="136.86" y="1217.4" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="6.46" font-weight="700">H08</text><rect x="223.5" y="1150.9" width="47.5" height="91.2" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="226.16" y="1196.5" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="6.46" font-weight="700">E01</text><rect x="214.0" y="1264.9" width="53.2" height="49.4" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="216.66" y="1289.6" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="6.46" font-weight="700">R01</text><rect x="208.3" y="1320.0" width="62.7" height="36.1" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="210.96" y="1338.05" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="6.46" font-weight="700">R02</text><rect x="191.2" y="1358.0" width="76.0" height="43.7" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="193.86" y="1379.85" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="6.46" font-weight="700">R03</text><rect x="130.4" y="1358.0" width="43.7" height="43.7" rx="4" fill="#edf0f2" stroke="#18364d" stroke-width="2.5"/><text x="133.06" y="1379.85" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="6.46" font-weight="700">R04</text><path d="M242.5 1318.1V1358.0" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><path d="M219.7 1331.4L153.2 1352.3V1358.0" fill="none" stroke="#ad671c" stroke-width="3" marker-end="url(#a)"/><path d="M119.0 1356.1L271.0 1356.1" fill="none" stroke="#18364d" stroke-width="3" stroke-dasharray="10 8"/><text x="125.65" y="1282.0" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="5.7" font-weight="400">独立封闭污巾通道</text><text x="125.65" y="1292.45" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="5.32" font-weight="400">不得穿过净巾接触面</text><text x="375" y="1185" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">H03 在同一柜体中的位置</text><text x="375" y="1245" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">左图固定为LVT-ONE；上方为该部件的局部放大，不是另一台柜。</text><text x="375" y="1300" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">送料方向统一：从柜后向柜前；M1、M2与H07沿柜深排列。</text><text x="375" y="1355" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">H01—H08全部位于左上净巾舱；图02、17、19定义整柜位置。</text></svg>