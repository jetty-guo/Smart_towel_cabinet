<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img"><title>研发到量产的资料回路</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1000" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">157  研发到量产的资料回路</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">读图：按箭头顺序完成；未满足本节条件，不跳过检查进入下一步</text><rect x="65.0" y="200" width="531.3333333333334" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65.0" y="200" width="531.3333333333334" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">01  需求与风险</text><text x="87.0" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">每项有负责人、编号和退出条件</text><path d="M600.3333333333334 305L628.3333333333334 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="634.3333333333334" y="200" width="531.3333333333334" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="634.3333333333334" y="200" width="531.3333333333334" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="656.3333333333334" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">02  图纸与采购</text><text x="656.3333333333334" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">同版本接口、BOM、协议和报价</text><path d="M1169.6666666666667 305L1197.6666666666667 305" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1203.6666666666667" y="200" width="531.3333333333334" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1203.6666666666667" y="200" width="531.3333333333334" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1225.6666666666667" y="247" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">03  样机与验证</text><text x="1225.6666666666667" y="296" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">失败形成变更，变更触发重测</text><path d="M1469.3333333333335 410L1469.3333333333335 470" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1203.6666666666667" y="485" width="531.3333333333334" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1203.6666666666667" y="485" width="531.3333333333334" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1225.6666666666667" y="532" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">04  首件与FAT</text><text x="1225.6666666666667" y="581" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">逐台记录，缺陷不跨阶段放行</text><path d="M1199.6666666666667 590L1171.6666666666667 590" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="634.3333333333334" y="485" width="531.3333333333334" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="634.3333333333334" y="485" width="531.3333333333334" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="656.3333333333334" y="532" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">05  安装与SAT</text><text x="656.3333333333334" y="581" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">现场参数、权限和实际流程复验</text><path d="M630.3333333333334 590L602.3333333333334 590" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="65.0" y="485" width="531.3333333333334" height="210" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65.0" y="485" width="531.3333333333334" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87.0" y="532" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">06  运营反馈</text><text x="87.0" y="581" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">故障与成本回写需求，评审是否扩点</text><rect x="65" y="820" width="1670" height="75" rx="12" fill="#fff4e5" stroke="#efd2a5" stroke-width="2.5"/><text x="90" y="856" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">每次整改必须回写源文件与影响范围；文档签收不替代实物验收。</text><path d="M65 928L1735 928" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="970" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>