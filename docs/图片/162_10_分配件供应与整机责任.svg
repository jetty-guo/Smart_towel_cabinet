<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1130" viewBox="0 0 1800 1130" role="img"><title>分配件采购：多家供货，一个整机责任方</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1130" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">162  分配件采购：多家供货，一个整机责任方</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">已找到14条采购线索；来源关联不代表已报价、在售、通过试机或获采购批准</text><rect x="65" y="185" width="400" height="280" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="185" width="400" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="234" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">RFID</text><text x="87" y="279" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">SP01 标签</text><text x="87" y="315" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">SP02 读写器</text><text x="87" y="380" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" font-weight="400">天线另分料号，做读区验证</text><path d="M265 465L265 515" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="488" y="185" width="400" height="280" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="488" y="185" width="400" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="510" y="234" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">传动与机构</text><text x="510" y="279" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">SP03电机／SP04带轮</text><text x="510" y="315" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">SP05胶辊／SP06执行件</text><text x="510" y="380" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" font-weight="400">SP13加工线索，待单条验证</text><path d="M688 465L688 515" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="911" y="185" width="400" height="280" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="911" y="185" width="400" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="933" y="234" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">电气与联网</text><text x="933" y="279" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">SP07传感／SP08电源</text><text x="933" y="315" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">SP09线束／SP14网络</text><text x="933" y="380" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" font-weight="400">主控MC01—04官网核规格</text><path d="M1111 465L1111 515" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1334" y="185" width="400" height="280" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1334" y="185" width="400" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1356" y="234" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">柜体与容器</text><text x="1356" y="279" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">SP10钣金／SP11容器</text><text x="1356" y="315" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">SP12 紧固件</text><text x="1356" y="380" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" font-weight="400">净污隔离与维护接口冻结</text><path d="M1534 465L1534 515" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="530" width="1670" height="128" rx="12" fill="#dceef0" stroke="#087f86" stroke-width="2.5"/><text x="95" y="577" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="31" font-weight="700">整机责任方：统一图纸、BOM、I/O、固件版本、模块边界和装配质量</text><text x="95" y="625" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="27" font-weight="400">每家只对合同范围供货；Liveo适配、单条出巾、湿巾归还和安全闭环仍需整机共同验证</text><rect x="65" y="725" width="525" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="725" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="774" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">1 · 核主体和链接</text><text x="87" y="819" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">官网／展会／索引分级</text><text x="87" y="855" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">登录复核当前店铺与SKU</text><path d="M590 824L628 824" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="725" width="525" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="635" y="725" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="657" y="774" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">2 · 索样和报价</text><text x="657" y="819" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">按实际毛巾与负载试机</text><text x="657" y="855" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">缺项、失败、未报价保留</text><path d="M1160 824L1198 824" fill="none" stroke="#087f86" stroke-width="3" marker-end="url(#a)"/><rect x="1205" y="725" width="525" height="200" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1205" y="725" width="525" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1227" y="774" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">3 · 冻结和验收</text><text x="1227" y="819" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">图纸与接口通过后采购</text><text x="1227" y="855" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">FAT → SAT → 运维追溯</text><text x="65" y="1000" fill="#ad671c" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="28" font-weight="700">没有核实的专用品类继续列缺口；不靠普通输送机、免插卡标题或无关商品凑齐采购表。</text><path d="M65 1058L1735 1058" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1100" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">阅读辅助示意｜不是实物测试记录、制造CAD或认证结论；具体实现与阈值按正文及批准工程文件。</text></svg>