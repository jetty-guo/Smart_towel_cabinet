<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img"><title>机械图纸应交付哪些界面</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1000" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">65  机械图纸应交付哪些界面</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">读图：中心模块与外围输入／交付项的关系；具体接口以受控文档为准</text><rect x="670" y="385" width="460" height="190" rx="12" fill="#dceef0" stroke="#087f86" stroke-width="2.5"/><text x="706" y="455" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="33" font-weight="400">受控机械图纸包</text><rect x="65" y="190" width="515" height="185" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="190" width="515" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="237" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">总装基准</text><text x="87" y="286" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">轴线、安装面、模块接口</text><path d="M580 282L670 480" fill="none" stroke="#d8e4ec" stroke-width="3"/><rect x="1220" y="190" width="515" height="185" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1220" y="190" width="515" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1242" y="237" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">轴系剖面</text><text x="1242" y="286" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">轴承定位、联接和防松</text><path d="M1220 282L1130 480" fill="none" stroke="#d8e4ec" stroke-width="3"/><rect x="65" y="420" width="515" height="185" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="420" width="515" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="467" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">钣金零件</text><text x="87" y="516" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">公差、圆角、材料与表面</text><path d="M580 512L670 480" fill="none" stroke="#d8e4ec" stroke-width="3"/><rect x="1220" y="420" width="515" height="185" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1220" y="420" width="515" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="1242" y="467" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">可调位置</text><text x="1242" y="516" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">分离预紧、导向和张紧</text><path d="M1220 512L1130 480" fill="none" stroke="#d8e4ec" stroke-width="3"/><rect x="65" y="650" width="515" height="185" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="65" y="650" width="515" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="87" y="697" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" font-weight="700">维护空间</text><text x="87" y="746" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">清洁、拆换与线束路径</text><path d="M580 742L670 480" fill="none" stroke="#d8e4ec" stroke-width="3"/><rect x="1220" y="650" width="515" height="185" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="1220" y="650" width="515" height="7" rx="3" 