 fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">电气干舱</text><text x="832" y="594" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">固定右上E01，禁止画成落地侧塔</text><rect x="810" y="645" width="880" height="128" rx="12" fill="white" stroke="#d8e4ec" stroke-width="2.5"/><rect x="810" y="645" width="880" height="7" rx="3" fill="#087f86" stroke="#087f86" stroke-width="2.5"/><text x="832" y="694" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="30" font-weight="700">下部箱体维护</text><text x="832" y="739" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">底部门抽取R03/R04，不开启净巾罩</text><text x="100" y="995" fill="#087f86" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="26" font-weight="400">模块编号贯穿外观、剖面、安装、I/O与交底；任何位置调整须同步修改母图和关联文件。</text><path d="M65 1068L1735 1068" fill="none" stroke="#d8e4ec" stroke-width="3"/><text x="65" y="1110" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" font-weight="400">LVT-ONE / V1.6 · 同一柜体与模块坐标；布局示意，毫米尺寸、公差、容量和安全距离待工程验证。</text></svg>