<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140" role="img"><title>H09 统一机架与维护界面</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9z" fill="#087f86"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#abc2cf" stroke-width="3"/></pattern></defs><rect width="1800" height="1140" fill="#f4f8fb"/><text x="65" y="74" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" font-weight="700">49  H09 统一机架与维护界面</text><text x="65" y="120" fill="#587080" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" font-weight="400">统一模块位置；箭头或框线不构成已完成的性能、安全或专利证明</text><rect x="130" y="210" width="450.0" height="675.0" rx="6.75" fill="#eef1f2" stroke="#18364d" stroke-width="2.5"/><rect x="130" y="858.0" width="450.0" height="27.0" rx="0" fill="#35444e" stroke="#18364d" stroke-width="2.5"/><rect x="197.5" y="259.5" width="180.0" height="112.5" rx="4" fill="#b7dad8" stroke="#18364d" stroke-width="2.5"/><text x="203.8" y="308.75" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15.3" font-weight="700">H01</text><text x="203.8" y="330.75" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.05" font-weight="400">净巾料仓</text><rect x="197.5" y="372.0" width="180.0" height="22.5" rx="4" fill="#679bbd" stroke="#18364d" stroke-width="2.5"/><text x="203.8" y="388.25" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="15.3" font-weight="700">H06</text><text x="251.8" y="388.25" fill="#18364d" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.05" font-weight="400">M2接料保持</text><rect x="211.0" y="394.5" width="162.0" height="45.0" rx="4" fill="#a2d2d1" stroke="#18364d" stroke-width="2.5"/><text x="217.3" y="422.0" fill="#18364d" font-famil