<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img"><title>图6 重复消息、断网与重启恢复</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#192f3f"/></marker></defs><rect width="1800" height="1320" fill="white"/><text x="65" y="78" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" fill="#192f3f" font-weight="700">图6  重复消息、断网与重启恢复</text><text x="65" y="126" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">智能毛巾柜技术交底附图 · 同一柜体、同一部件标号</text><rect x="85" y="220" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="262" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">1 事件或故障触发</text><text x="107" y="306" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">重复命令、通信中断、供电重启</text><text x="107" y="342" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">先保持本地安全，读取310记录</text><path d="M830 305L900 305" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="915" y="220" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="937" y="262" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">2 校验原执行身份</text><text x="937" y="306" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">同ID同内容：返回原状态</text><text x="937" y="342" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">同ID异内容/已取消封禁：拒绝</text><path d="M1285 395V425H455V457" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="85" y="465" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="507" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">3 按原物理阶段判断</text><text x="107" y="551" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">未放行且无有效许可：保持</text><text x="107" y="587" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">有原有效许可：依本地条件处理</text><path d="M830 550L900 550" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="915" y="465" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="937" y="507" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">4 已开始但结果不明</text><text x="937" y="551" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">不把超时或重启当成未执行</text><text x="937" y="587" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">保留原任务与实际物体/箱批次</text><path d="M1285 640V670H455V702" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="85" y="710" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="752" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">5 核验及受控维护</text><text x="107" y="796" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">隔离能源、核实物、编号交接</text><text x="107" y="832" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">补传/查询原事件，不再驱动补发</text><path d="M830 795L900 795" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="915" y="710" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="937" y="752" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">6 恢复服务</text><text x="937" y="796" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">机构复位与清场，平台原任务对账</text><text x="937" y="832" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">全部满足后才释放位置和通道</text><rect x="85" y="1000" width="1570" height="155" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="1042" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">不可跳过的限制</text><text x="107" y="1086" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">无法耐久存储新证据时停止新动作；记录损坏时待核验，不自动清空历史。</text><text x="107" y="1122" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">新的领还任务需要在线建立；已接受任务的安全收尾不等于开放离线新领还。</text><path d="M65 1238L1735 1238" fill="none" stroke="#192f3f" stroke-width="2.8"/><text x="65" y="1281" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" fill="#192f3f" font-weight="400">流程中不满足条件时保持原任务和实物位置；记录、核验、复位及平台对账完成后恢复。</text></svg>