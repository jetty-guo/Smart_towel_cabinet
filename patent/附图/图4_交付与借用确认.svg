<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img"><title>图4 实物交付与借用确认</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#192f3f"/></marker></defs><rect width="1800" height="1320" fill="white"/><text x="65" y="78" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" fill="#192f3f" font-weight="700">图4  实物交付与借用确认</text><text x="65" y="126" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">智能毛巾柜技术交底附图 · 同一柜体、同一部件标号</text><rect x="85" y="220" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="262" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">1 本地再核验</text><text x="107" y="306" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">许可适用且有效、维护防护满足</text><text x="107" y="342" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">取物斗空闲，140反馈无矛盾</text><path d="M830 305L900 305" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="915" y="220" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="937" y="262" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">2 记录释放开始意图</text><text x="937" y="306" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">310先耐久保存原任务执行身份</text><text x="937" y="342" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">记录失败则不启动释放</text><path d="M1285 395V425H455V457" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="85" y="465" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="507" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">3 140 → 150 实物交付</text><text x="107" y="551" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">按许可释放，当前毛巾经过151/S2</text><text x="107" y="587" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">152/S3确认取物斗由空转有物</text><path d="M830 550L900 550" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="915" y="465" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="937" y="507" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">4 使用者取走本条</text><text x="937" y="551" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">S3由有物稳定变空，与S2过程对应</text><text x="937" y="587" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">顺序矛盾或未取走则不确认成功</text><path d="M1285 640V670H455V702" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="85" y="710" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="752" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">5 保存及上报原事件</text><text x="107" y="796" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">同eventId补传，等平台应用结果</text><text x="107" y="832" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">PUBACK/RECEIVED不是借用完成</text><path d="M830 795L900 795" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="915" y="710" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="937" y="752" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">6 平台400应用并复位</text><text x="937" y="796" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">按原任务和轮次幂等确认借用</text><text x="937" y="832" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">机械清场、事件处理后释放通道</text><rect x="85" y="1000" width="1570" height="155" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="1042" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">结果不明出口</text><text x="107" y="1086" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">卡在出口、S2/S3矛盾、未取走：保留原任务，处理残留实物后再核验。</text><text x="107" y="1122" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">平台应答丢失：查询原事件；不重新送料，不通过更换命令编号补发。</text><path d="M65 1238L1735 1238" fill="none" stroke="#192f3f" stroke-width="2.8"/><text x="65" y="1281" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" fill="#192f3f" font-weight="400">流程中不满足条件时保持原任务和实物位置；记录、核验、复位及平台对账完成后恢复。</text></svg>