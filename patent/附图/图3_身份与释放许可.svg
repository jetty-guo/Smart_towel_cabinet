<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img"><title>图3 身份核验与本条释放许可</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#192f3f"/></marker></defs><rect width="1800" height="1320" fill="white"/><text x="65" y="78" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" fill="#192f3f" font-weight="700">图3  身份核验与本条释放许可</text><text x="65" y="126" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">智能毛巾柜技术交底附图 · 同一柜体、同一部件标号</text><rect x="85" y="220" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="262" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">1 终端500 → 平台400</text><text x="107" y="306" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">认证账号关联本次发放任务</text><text x="107" y="342" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">平台核设备归属与领用条件</text><path d="M830 305L900 305" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="915" y="220" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="937" y="262" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">2 110/120 形成保持状态</text><text x="937" y="306" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">M1在交接窗口停，M2接住并停稳</text><text x="937" y="342" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">本条在受控区，140保持隔离</text><path d="M1285 395V425H455V457" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="85" y="465" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="507" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">3 130 在当前窗口读取</text><text x="107" y="551" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">131读取候选身份，关联原任务</text><text x="107" y="587" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">无有效/多候选/冲突则待核验</text><path d="M830 550L900 550" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="915" y="465" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="937" y="507" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">4 平台400 锁定本条</text><text x="937" y="551" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">核可发放、装载及占用状态</text><text x="937" y="587" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">关联毛巾与原任务、资产轮次</text><path d="M1285 640V670H455V702" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="85" y="710" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="752" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">5 返回ReleasePermit</text><text x="107" y="796" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">仅适用于本设备、本任务、本条</text><text x="107" y="832" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">重试返回原许可，不另建轮次</text><path d="M830 795L900 795" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="915" y="710" width="740" height="170" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="937" y="752" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">6 300/310 持久化许可</text><text x="937" y="796" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">保存许可，再核本地安全与有效性</text><text x="937" y="832" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">满足才进入图4释放流程</text><rect x="85" y="1000" width="1570" height="155" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="1042" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">失败与超时出口</text><text x="107" y="1086" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">身份不明、许可缺失或本地条件不足：毛巾留120，不开放库存、不确认借出。</text><text x="107" y="1122" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">只有候选标签不证明只有一条；分离可靠性仍由真实毛巾试验验证。</text><path d="M65 1238L1735 1238" fill="none" stroke="#192f3f" stroke-width="2.8"/><text x="65" y="1281" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" fill="#192f3f" font-weight="400">流程中不满足条件时保持原任务和实物位置；记录、核验、复位及平台对账完成后恢复。</text></svg>