ont-weight="400">111 第一输送带 → 121 第二输送带</text><text x="1150" y="745" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#192f3f" font-weight="400">112 分离件；114 过渡剥离件</text><text x="1150" y="790" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#192f3f" font-weight="400">131 局部天线；140 前端释放件</text><text x="1150" y="835" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#192f3f" font-weight="400">150 取物斗接同一左上领巾口</text><path d="M1160 620L1650 620" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><text x="1150" y="965" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#192f3f" font-weight="400">两段分别驱动，当前物体停在120</text><text x="1150" y="1010" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="24" fill="#192f3f" font-weight="400">取得许可与本地放行后进入150</text><rect x="90" y="1100" width="1610" height="185" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="112" y="1142" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">空间约束与维护对应</text><text x="112" y="1186" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">L_h ≥ L_m + d_s + δ；有效保持长度按运动中可能展开的实物确定。</text><text x="112" y="1222" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">100/110/120/140/150全部位于左上净巾路径；200/210/220/230为独立湿巾路径。</text><text x="112" y="1258" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">所有总体尺寸共同由W/H/D确定；底部两箱经同一底部门抽取，图形位置不作为毫米加工尺寸。</text><path d="M65 1368L1735 1368" fill="none" stroke="#192f3f" stroke-width="2.8"/><text x="65" y="1411" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" fill="#192f3f" font-weight="400">图2｜正面开口、柜内位置和纵剖对应同一布局；虚拟外形不替代总装CAD及安全验证。</text></svg>