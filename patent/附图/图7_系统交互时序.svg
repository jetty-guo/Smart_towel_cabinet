xt><path d="M1590 982L1100 982" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><text x="1115" y="967" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" fill="#192f3f" font-weight="400">S2经过＋S3有物→取走后清空</text><path d="M1100 1061L630 1061" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><text x="645" y="1046" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" fill="#192f3f" font-weight="400">原eventId：提交取走证据</text><path d="M630 1140L1100 1140" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><text x="645" y="1125" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" fill="#192f3f" font-weight="400">APPLIED：原轮次借用确认</text><path d="M630 1219L180 1219" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><text x="195" y="1204" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="22" fill="#192f3f" font-weight="400">查询或通知：本次领用完成</text><rect x="85" y="1375" width="1610" height="100" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="107" y="1417" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">MQTT确认边界</text><text x="107" y="1461" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">PUBACK只确认传输；RECEIVED只确认耐久接收；业务完成以APPLIED或明确待核验结论为准。</text><path d="M65 1478L1735 1478" fill="none" stroke="#192f3f" stroke-width="2.8"/><text x="65" y="1521" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" fill="#192f3f" font-weight="400">图7｜箭头为逻辑消息，设备消息经MQTT Broker路由；图中不将网络确认等同于实物完成。</text></svg>