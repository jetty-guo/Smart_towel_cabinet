<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1270" viewBox="0 0 1800 1270" role="img"><title>图5 湿巾回收与单件异常隔离</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#192f3f"/></marker></defs><rect width="1800" height="1270" fill="white"/><text x="65" y="78" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="43" fill="#192f3f" font-weight="700">图5  湿巾回收与单件异常隔离</text><text x="65" y="126" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">智能毛巾柜技术交底附图 · 同一柜体、同一部件标号</text><rect x="80" y="210" width="400.0" height="600.0" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><rect x="140.0" y="254.0" width="160.0" height="100.0" rx="5" fill="white" stroke="#192f3f" stroke-width="2.6"/><text x="147.2" y="304.0" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.600000000000001" fill="#192f3f" font-weight="700">100</text><rect x="140.0" y="354.0" width="160.0" height="20.0" rx="5" fill="white" stroke="#192f3f" stroke-width="2.6"/><text x="147.2" y="364.0" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.600000000000001" fill="#192f3f" font-weight="700">120</text><rect x="152.0" y="374.0" width="144.0" height="40.0" rx="5" fill="white" stroke="#192f3f" stroke-width="2.6"/><text x="159.2" y="394.0" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.600000000000001" fill="#192f3f" font-weight="700">150</text><rect x="340.0" y="254.0" width="100.0" height="192.0" rx="5" fill="white" stroke="#192f3f" stroke-width="2.6"/><text x="347.2" y="350.0" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.600000000000001" fill="#192f3f" font-weight="700">300</text><rect x="320.0" y="494.0" width="112.0" height="104.0" rx="5" fill="white" stroke="#192f3f" stroke-width="2.6"/><text x="327.20000000000005" y="546.0" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.600000000000001" fill="#192f3f" font-weight="700">200</text><rect x="308.0" y="610.0" width="132.0" height="76.0" rx="5" fill="white" stroke="#192f3f" stroke-width="2.6"/><text x="315.20000000000005" y="648.0" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.600000000000001" fill="#192f3f" font-weight="700">210</text><rect x="272.0" y="690.0" width="160.0" height="92.0" rx="5" fill="white" stroke="#192f3f" stroke-width="2.6"/><text x="279.20000000000005" y="736.0" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.600000000000001" fill="#192f3f" font-weight="700">220</text><rect x="144.0" y="690.0" width="92.0" height="92.0" rx="5" fill="white" stroke="#192f3f" stroke-width="2.6"/><text x="151.2" y="736.0" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="13.600000000000001" fill="#192f3f" font-weight="700">230</text><path d="M376.0 602.0V694.0" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M332.0 646.0L190.0 694.0" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="710" y="205" width="990" height="160" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="732" y="247" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">200 小仓 / 201 外侧入口</text><text x="732" y="291" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">先有回执、单次投入；关闭到位后才识别</text><text x="732" y="327" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">201未安全关闭 → 不动作211，不允许向下游移交</text><path d="M1205 370L1205 420" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="710" y="430" width="990" height="180" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="732" y="472" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">210转移组件：211内部转移件 + 212分流导向件</text><text x="732" y="516" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">身份/原轮次、箱在位/批次/容量、路线许可分别核对</text><text x="732" y="552" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">212到位反馈正确后打开211；转移时保持201隔离</text><path d="M1030 615V680H925V720" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><path d="M1390 615V680H1465V720" fill="none" stroke="#192f3f" stroke-width="2.8" marker-end="url(#arrow)"/><rect x="680" y="730" width="510" height="180" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="702" y="772" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">220 正常回收箱</text><text x="702" y="816" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">身份和原借用已匹配</text><text x="702" y="852" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">实际到箱、原仓清空</text><text x="702" y="888" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">平台应用后确认原轮次归还</text><rect x="1250" y="730" width="470" height="180" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="1272" y="772" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">230 单件异常箱</text><text x="1272" y="816" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">身份不明，单件位置空闲</text><text x="1272" y="852" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">移交后锁定一个caseId</text><text x="1272" y="888" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">显示已收件、待核验</text><rect x="660" y="985" width="1060" height="145" rx="5" fill="#f2f5f7" stroke="#192f3f" stroke-width="2.6"/><text x="682" y="1027" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="29" fill="#192f3f" font-weight="700">230不可用／反馈矛盾／转移许可不足</text><text x="682" y="1071" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">留200并停收；不混入220。已不可逆落入220时按实际箱批次冻结，</text><text x="682" y="1107" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="25" fill="#192f3f" font-weight="400">不能虚构在230。授权人员取出后编号签收，复位与原任务对账再恢复。</text><path d="M65 1188L1735 1188" fill="none" stroke="#192f3f" stroke-width="2.8"/><text x="65" y="1231" font-family="PingFang SC,Heiti SC,Arial,sans-serif" font-size="23" fill="#192f3f" font-weight="400">图5｜左侧是同柜空间定位，右侧是受控转移关系；230每次一件，200为异常时的保持位置。</text></svg>